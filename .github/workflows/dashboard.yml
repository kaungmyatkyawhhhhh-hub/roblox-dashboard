name: Update dashboard

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also redeploy the website'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Player-count history lives on the `stats` branch as a single commit
      # that is replaced on every run, so it never grows the repo's history.
      - name: Restore history
        run: git fetch --depth=1 origin stats && git show origin/stats:history.json > history.json || echo '{}' > history.json

      - name: Collect stats
        run: node scripts/collect.js history.json site/data.json
        env:
          # Optional: login cookie of an account that can view the group's revenue.
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          # Optional: where alerts and the weekly report go.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save history
        run: |
          tmp=$(mktemp -d)
          cp history.json site/data.json "$tmp/"
          cd "$tmp"
          git init -q -b stats
          git add history.json data.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Update stats history"
          # GitHub sometimes rejects pushes for a few minutes (500 errors). Retry, and if it
          # still fails, keep going so the site is still updated; the next run saves history.
          for wait in 5 15 30 0; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stats && exit 0
            [ "$wait" = 0 ] && break
            echo "push failed, retrying in ${wait}s"; sleep "$wait"
          done
          echo "::warning::Couldn't save the stats history (GitHub rejected the push)."

      # The page reads fresh data.json from the stats branch, so the site itself is only
      # redeployed when its code changes (or on request). GitHub Pages quietly stops
      # publishing when a site is deployed more than about 10 times an hour.
      - name: Build site
        if: github.event_name == 'push' || inputs.deploy
        run: cp public/index.html site/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || inputs.deploy
        with:
          path: site

      - id: deploy
        if: github.event_name == 'push' || inputs.deploy
        uses: actions/deploy-pages@v4
