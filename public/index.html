// ---- music-reactive visuals: equalizers, beat pulse, page-wide artwork glow ----
// Generated moods are analyzed for real. YouTube audio plays inside YouTube's own
// frame and can't be read by the page, so YouTube tracks drive a simulated spectrum.
let vizRunning = false, beat = 0, idleT = 0;

// Theme colour lookups are cached; reading computed styles every frame is slow.
let inkCache = null;
const themeInk = () => inkCache || (inkCache = cssVar('--ink'));
new MutationObserver(() => { inkCache = null; }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { inkCache = null; });

// The beat value is written only to the few elements that pulse with it, so the
// browser doesn't have to recheck styles across the whole page on every frame.
let beatShown = -1;
function setBeat(v) {
  if (Math.abs(v - beatShown) < 0.01 && v !== 0) return;
  beatShown = v;
  const val = v.toFixed(3);
  for (const el of document.querySelectorAll('.p-art')) el.style.setProperty('--beat', val);
}
const EQ_BARS = 64;
const spectrum = new Float32Array(EQ_BARS);

function fakeSpectrum(t, out) {
  const bpm = 116, phase = (t * bpm / 60) % 1;
  const kick = Math.exp(-phase * 7), snare = Math.exp(-((phase + 0.5) % 1) * 9);
  for (let i = 0; i < out.length; i++) {
    const f = i / out.length;
    const wob = 0.5 + 0.5 * Math.sin(t * (1.7 + i * 0.31) + i * 1.9) * Math.sin(t * (0.6 + i * 0.11) + i);
    const body = (1 - f) * 0.5 + 0.12;
    out[i] = Math.min(1, body * (0.35 + 0.65 * wob) + kick * (1 - f) ** 2 * 0.55 + snare * f * (1 - f) * 0.9);
  }
}

function drawBars(canvas, values, { gap = 3, mirror = false, alpha = 1, minH = 3 } = {}) {
  if (!canvas || !canvas.clientWidth) return;
  const g = canvas.getContext('2d');
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const vals = mirror ? [...[...values].reverse(), ...values] : values;
  const n = vals.length, bw = Math.max(1, (w - gap * (n - 1)) / n);
  const ink = themeInk();
  const tint = artColor || ink;
  const grad = g.createLinearGradient(0, h, 0, 0);
  grad.addColorStop(0, tint);
  grad.addColorStop(1, ink);
  g.globalAlpha = alpha;
  g.fillStyle = grad;
  // A small glow only on the larger visualizer; shadow blur is costly to draw.
  g.shadowColor = tint;
  g.shadowBlur = w > 120 ? 6 : 0;
  for (let i = 0; i < n; i++) {
    const bh = Math.max(minH, vals[i] * (h - 4));
    const x = i * (bw + gap), y = mirror ? h - bh : (h - bh) / 2;
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, bw, bh, Math.min(bw / 2, 3)); else g.rect(x, y, bw, bh);
    g.fill();
  }
  g.globalAlpha = 1;
}

function drawViz() {
  if (vizRunning) return;
  vizRunning = true;
  const bins = new Uint8Array(128);
  let skip = false;
  const frame = () => {
    // 30 fps is plenty for bars and halves the work.
    skip = !skip;
    if (skip) { requestAnimationFrame(frame); return; }
    const open = $('player').classList.contains('open');
    const playing = isPlaying();
    if (!playing && beat < 0.01 && !open) {
      vizRunning = false;
      setBeat(0);
      document.body.classList.remove('eq-on');
      drawBars($('eq-mini'), new Array(9).fill(0.1), { gap: 2, minH: 2 });
      return;
    }
    idleT += 1 / 30;
    const target = new Float32Array(EQ_BARS);
    if (src === 'yt' && ytPlaying) fakeSpectrum(performance.now() / 1000, target);
    else if (src !== 'yt' && music.playing && music.analyser) {
      music.analyser.getByteFrequencyData(bins);
      for (let i = 0; i < EQ_BARS; i++) {
        // Log-spaced bins, with highs lifted so the whole bar row moves.
        const idx = Math.floor((i / EQ_BARS) ** 1.35 * 72) + 2;
        target[i] = Math.min(1, (bins[idx] / 255) * (0.75 + (i / EQ_BARS) * 1.4));
      }
    } else {
      for (let i = 0; i < EQ_BARS; i++) target[i] = 0.04 + Math.sin(idleT * 1.8 + i * 0.45) * 0.025;
    }
    let low = 0;
    for (let i = 0; i < EQ_BARS; i++) {
      // Fast attack, slower release, like a real meter.
      const k = target[i] > spectrum[i] ? 0.5 : 0.12;
      spectrum[i] += (target[i] - spectrum[i]) * k;
      if (i < 6) low += spectrum[i] / 6;
    }
    beat += ((playing ? low : 0) - beat) * 0.25;
    setBeat(beat);
    if (document.body.classList.contains('eq-on') !== playing) document.body.classList.toggle('eq-on', playing);
    if (open) drawBars($('p-viz'), Array.from({ length: 36 }, (_, i) => spectrum[Math.floor((i / 36) * EQ_BARS)]));
    drawBars($('eq-mini'), Array.from({ length: 9 }, (_, i) => spectrum[Math.floor((i / 9) * EQ_BARS * 0.7)]), { gap: 2, minH: 2 });
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
requestAnimationFrame(() => drawBars($('eq-mini'), new Array(9).fill(0.1), { gap: 2, minH: 2 }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && (isPlaying() || $('player').classList.contains('open'))) drawViz(); });

// Page-wide artwork: YouTube's thumbnail plus three stills from the video, blurred,
// crossfading slowly behind the whole dashboard while a song plays.
var artColor = '';
var artFrames = [], artFrameIdx = 0, artLayer = 0, artTimer = null, artVideo = null, artFallback = '';

// Draw a still of the video into the backdrop: lightly softened and dimmed once,
// so the video stays recognisable without any per-frame blur.
let ambientImg = null;
function paintAmbient(c, img) {
  const g = c.getContext('2d');
  c.width = 640; c.height = 360;
  // hq stills are 4:3 with black bars around a 16:9 picture; crop to the picture.
  let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
  if (sw / sh < 1.5) { sh = sw * 9 / 16; sy = (img.naturalHeight - sh) / 2; }
  g.filter = 'blur(2px)';
  g.drawImage(img, sx, sy, sw, sh, -8, -8, c.width + 16, c.height + 16);
  g.filter = 'none';
  const light = !matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'dark' || document.documentElement.dataset.theme === 'light';
  g.fillStyle = light ? 'rgb(255 255 255 / .2)' : 'rgb(0 0 0 / .1)';
  g.fillRect(0, 0, c.width, c.height);
}

function showAmbientFrame(url, fallback) {
  const img = new Image();
  img.onload = () => {
    // YouTube serves a small grey placeholder when a size doesn't exist.
    if (img.naturalWidth < 200 && fallback) return showAmbientFrame(fallback);
    const layers = document.querySelectorAll('.ambient-bg canvas');
    artLayer = 1 - artLayer;
    paintAmbient(layers[artLayer], img);
    ambientImg = img;
    layers[artLayer].classList.add('on');
    layers[1 - artLayer].classList.remove('on');
  };
  img.onerror = () => { if (fallback) showAmbientFrame(fallback); };
  img.src = url;
}
// Repaint with the right dimming when the theme changes.
new MutationObserver(() => { if (ambientImg) paintAmbient(document.querySelectorAll('.ambient-bg canvas')[artLayer], ambientImg); })
  .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function pickArtColor(id) {
  // Average colour of the thumbnail tints the equalizers. Needs CORS on the image;
  // if the browser blocks reading it, the bars simply stay white.
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = 24; c.height = 14;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, 24, 14);
      const d = g.getImageData(0, 0, 24, 14).data;
      let r = 0, gg = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {
        const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
        const wgt = 0.2 + (mx - mn) / 255; // favour colourful pixels
        r += d[i] * wgt; gg += d[i + 1] * wgt; b += d[i + 2] * wgt; n += wgt;
      }
      // Lift brightness so the glow reads on black.
      const lift = (v) => Math.round(Math.min(255, (v / n) * 1.25 + 40));
      artColor = `rgb(${lift(r)} ${lift(gg)} ${lift(b)})`;
      document.documentElement.style.setProperty('--art-color', artColor);
    } catch { artColor = ''; }
  };
  img.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
}

function setAmbientArt(id) {
  if (id === artVideo) return;
  artVideo = id;
  clearInterval(artTimer);
  if (!id) {
    document.body.classList.remove('art-on');
    artColor = '';
    document.documentElement.style.removeProperty('--art-color');
    return;
  }
  document.body.classList.add('art-on');
  // Full-size thumbnail first, then three stills from through the video.
  artFrames = ['maxresdefault', 'hq1', 'hq2', 'hq3'].map((f) => `https://i.ytimg.com/vi/${id}/${f}.jpg`);
  artFallback = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  artFrameIdx = 0;
  showAmbientFrame(artFrames[0], artFallback);
  pickArtColor(id);
  if (!reduceMotion) artTimer = setInterval(() => { artFrameIdx = (artFrameIdx + 1) % artFrames.length; showAmbientFrame(artFrames[artFrameIdx], artFallback); }, 9000);
}

// ---- monetization (public store data + an estimator) ----
// Roblox keeps sales and revenue private to the owner, so this view shows what is
// public (every game pass and developer product with its price) plus an estimate
// that the viewer tunes themselves. Estimates are labelled as such everywhere.
const ROBLOX_CUT = 0.3;          // Roblox keeps 30% of game pass and developer product sales
const DEVEX_USD = 0.0038;        // Developer Exchange rate, USD per Robux (2025)
const TIERS = [[1, 25], [26, 50], [51, 100], [101, 250], [251, 500], [501, Infinity]];
const robux = (v) => `R$ ${fmt.format(Math.round(v))}`;
const VIEW_HASH = { money: '#monetization', compare: '#compare', reports: '#reports' };
let view = Object.keys(VIEW_HASH).find((k) => VIEW_HASH[k] === location.hash) || (['money', 'compare', 'reports'].includes(load('rgo.view')) && !location.hash ? load('rgo.view') : 'overview');
let est = { rate: Number(load('rgo.rate')) || 1, avg: Number(load('rgo.avg')) || 0 };

function setView(v) {
  view = v;
  store('rgo.view', v);
  if (!/^#game-/.test(location.hash)) history.replaceState(null, '', VIEW_HASH[v] || location.pathname + location.search);
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tab === v));
  document.querySelectorAll('[data-view]').forEach((el) => { el.hidden = el.dataset.view !== v; });
  if (v === 'money' && data) renderMoney(data.games);
  if (v === 'compare' && data) renderCompare(data.games);
  if (v === 'reports' && data) renderReports(data.games);
  if (v === 'overview' && data) { animateChart = true; render(); }
}

const storeItems = (g) => {
  const s = g.store || { passes: [], products: [] };
  return [
    ...s.passes.map((x) => ({ ...x, kind: 'pass', game: g })),
    ...s.products.map((x) => ({ ...x, kind: 'product', game: g })),
  ];
};
const median = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

function visitsPerDay(games) {
  const today = dayStart(Date.now());
  const gains = games.map(dailyGains);
  let sum = 0, days = 0;
  for (let i = 1; i <= 7; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const vals = gains.map((m) => m.get(d.getTime())).filter((v) => v != null);
    if (vals.length) { sum += vals.reduce((a, b) => a + b, 0); days++; }
  }
  return days ? sum / days : games.reduce((s, g) => s + visitsGained(g), 0);
}

function renderMoney(games) {
  if (!$('m-kpis')) return;
  renderRevenue(games);
  const items = games.flatMap(storeItems);
  const onSale = items.filter((x) => x.forSale && x.price > 0);
  const passes = onSale.filter((x) => x.kind === 'pass');
  const products = onSale.filter((x) => x.kind === 'product');
  const prices = onSale.map((x) => x.price);
  const loaded = games.some((g) => g.store);

  const tiles = [
    { label: 'Game passes', value: fmt.format(passes.length), sub: `${games.filter((g) => g.store && g.store.passes.length).length} of ${games.length} experiences sell them` },
    { label: 'Developer products', value: fmt.format(products.length), sub: 'Repeatable purchases' },
    { label: 'Average price', value: prices.length ? robux(prices.reduce((a, b) => a + b, 0) / prices.length) : '—', sub: prices.length ? `Median ${robux(median(prices))}` : 'Nothing on sale' },
    { label: 'Price range', value: prices.length ? `${robux(Math.min(...prices))}–${fmt.format(Math.max(...prices))}` : '—', sub: 'Cheapest to most expensive' },
    { label: 'Every pass, once', value: robux(passes.reduce((s, x) => s + x.price, 0)), sub: 'To own every pass' },
  ];
  $('m-kpis').innerHTML = tiles.map((t, i) => `
    <div class="panel kpi" style="--i:${i}">
      <div class="label">${t.label}</div>
      <div><span class="value num">${t.value}</span></div>
      <div class="sub num">${t.sub}</div>
    </div>`).join('');

  // Price tiers: how many items sit at each price point.
  const bars = TIERS.map(([lo, hi]) => ({
    label: hi === Infinity ? `${lo}+` : `${lo}–${hi}`,
    parts: [
      { name: 'Game passes', color: cssVar('--series-1'), v: passes.filter((x) => x.price >= lo && x.price <= hi).length },
      { name: 'Developer products', color: cssVar('--series-2'), v: products.filter((x) => x.price >= lo && x.price <= hi).length },
    ],
  }));
  $('m-tiers-legend').innerHTML = `<span><i class="key" style="background:${cssVar('--series-1')}"></i>Game passes</span><span><i class="key" style="background:${cssVar('--series-2')}"></i>Developer products</span>`;
  barChart($('m-tiers'), bars, { height: 236, label: 'Items per price tier', xLabel: (b) => (innerWidth < 600 ? b.label : `R$ ${b.label}`), tipTitle: (b) => `R$ ${b.label}`, unit: 'Items', sign: '' });

  // Estimator.
  if (!est.avg) est.avg = Math.round(median(prices)) || 50;
  const vpd = visitsPerDay(games);
  const totalVisits = games.reduce((s, g) => s + g.visits, 0);
  const net = (visits) => visits * (est.rate / 100) * est.avg * (1 - ROBLOX_CUT);
  const perDay = net(vpd);
  $('m-rate').value = est.rate;
  $('m-rate-out').textContent = `${est.rate.toFixed(1)}%`;
  if (document.activeElement !== $('m-avg')) $('m-avg').value = est.avg;
  $('m-rate').style.setProperty('--v', `${((est.rate - 0.1) / (10 - 0.1)) * 100}%`);
  $('m-est').innerHTML = `
    <div><div class="k">Per day</div><div class="v">${robux(perDay)}</div><div class="s">${fmt.format(Math.round(vpd))} visits/day × ${est.rate.toFixed(1)}%</div></div>
    <div><div class="k">Per month</div><div class="v">${robux(perDay * 30)}</div><div class="s">≈ $${(perDay * 30 * DEVEX_USD).toFixed(2)} via DevEx</div></div>
    <div><div class="k">All visits so far</div><div class="v">${robux(net(totalVisits))}</div><div class="s">${fmt.format(totalVisits)} visits</div></div>`;

  // Store lists per experience, priciest first.
  $('m-stores').innerHTML = games.map((g) => {
    const list = storeItems(g).filter((x) => x.price > 0).sort((a, b) => b.price - a.price);
    const sum = list.filter((x) => x.forSale);
    return `<section class="panel store">
      <div class="panel-head"><h2>${esc(g.name)}</h2><span class="meta">${list.filter((x) => x.kind === 'pass').length} passes · ${list.filter((x) => x.kind === 'product').length} products</span></div>
      <ul class="store-list">${list.length ? list.map((x) => `<li class="${x.forSale ? '' : 'off'}">
          ${x.icon ? `<img src="${esc(x.icon)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'), { className: 'ph' }))">` : '<span class="ph"></span>'}
          <span class="si"><b>${esc(x.name)}</b><span>${x.kind === 'pass' ? 'Game pass' : 'Developer product'}${x.forSale ? '' : ' · not on sale'}</span></span>
          <span class="price num">${robux(x.price)}</span>
        </li>`).join('') : `<li class="faint">${loaded ? 'Nothing for sale yet.' : 'Store data appears after the next update.'}</li>`}</ul>
    </section>`;
  }).join('');
}

document.addEventListener('input', (e) => {
  if (e.target.id === 'm-rate') { est.rate = Number(e.target.value); store('rgo.rate', est.rate); renderMoney(data.games); }
  if (e.target.id === 'm-avg') { est.avg = Math.max(1, Number(e.target.value) || 1); store('rgo.avg', est.avg); renderMoney(data.games); }
});
document.addEventListener('click', (e) => { const t = e.target.closest('.tabs button'); if (t) setView(t.dataset.tab); });

// ---- real revenue (when connected with ROBLOX_COOKIE) ----
let revGame = load('rgo.revgame') || 'all';
const REV_KEYS = { itemSaleRobux: 'Sales', premiumPayouts: 'Premium Payouts', groupPremiumPayouts: 'Premium Payouts', immersiveAdRevenue: 'Ads', subscriptionsRevenue: 'Subscriptions' };

function renderRevenue(games) {
  const rev = data.revenue || {};
  const sales = rev.sales || [];
  const has = rev.connected || sales.length;
  $('rev').hidden = !has;
  $('rev-setup').hidden = !!rev.connected;
  $('rev-error').textContent = rev.error || '';
  $('rev-error').hidden = !rev.error;
  $('estimator').hidden = !!rev.connected;
  if (!has) return;

  const gameName = new Map(games.map((g) => [String(g.universeId), g.name]));
  gameName.set('null', 'Group store items');
  const known = new Set(games.map((g) => String(g.universeId)));
  if (revGame !== 'all' && !known.has(revGame)) revGame = 'all';
  $('rev-game').innerHTML = [['all', 'All games'], ...games.map((g) => [String(g.universeId), g.name])]
    .map(([id, name]) => `<button type="button" data-rev="${id}" aria-pressed="${id === revGame}" title="${esc(name)}">${esc(name)}</button>`).join('');

  const mine = revGame === 'all' ? sales : sales.filter((x) => String(x.universeId) === revGame);
  const now = Date.now(), today = dayStart(now);
  const since = (ms) => mine.filter((x) => x.t >= ms);
  const sum = (list) => list.reduce((s, x) => s + x.robux, 0);
  const d7 = since(now - 7 * DAY), d30 = since(now - 30 * DAY);
  const first = mine.length ? mine[mine.length - 1].t : null;
  const pending = sum(mine.filter((x) => x.pending));

  // Roblox's own monthly summary (whole group) for Premium Payouts and a cross-check.
  let premium = 0, monthTotal = 0;
  for (const s of Object.values(rev.summaries || {})) {
    const m = s.month || {};
    premium += (m.premiumPayouts || 0) + (m.groupPremiumPayouts || 0);
    for (const k of Object.keys(REV_KEYS)) monthTotal += m[k] || 0;
  }
  const tiles = [
    { label: 'Robux today', value: robux(sum(since(today))), sub: `${since(today).length} sale${since(today).length === 1 ? '' : 's'}` },
    { label: 'Last 7 days', value: robux(sum(d7)), sub: `${d7.length} sales` },
    { label: 'Last 30 days', value: robux(sum(d30)), sub: revGame === 'all' && monthTotal ? `Roblox: ${robux(monthTotal)} this month` : `${d30.length} sales · avg ${robux(d30.length ? sum(d30) / d30.length : 0)}` },
    { label: 'All tracked', value: robux(sum(mine)), sub: first ? `${fmt.format(mine.length)} sales since ${new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' }).format(first)}` : 'No sales yet' },
    revGame === 'all'
      ? { label: 'Premium Payouts', value: robux(premium), sub: pending ? `This month · ${robux(pending)} pending sales` : 'This month' }
      : { label: 'Pending', value: robux(pending), sub: 'Settles in a few days' },
  ];
  $('rev-kpis').innerHTML = tiles.map((t, i) => `
    <div class="panel kpi" style="--i:${i}">
      <div class="label">${t.label}</div>
      <div><span class="value num">${t.value}</span></div>
      <div class="sub num">${t.sub}</div>
    </div>`).join('');
  $('rev-meta').textContent = rev.connected ? `Updated ${ago(rev.updatedAt)} · after Roblox's fee` : 'Last saved data · not connected';

  // Robux per day, stacked by game.
  const ids = revGame === 'all' ? [...new Set(sales.map((x) => String(x.universeId)))] : [revGame];
  const colorFor = (id) => {
    const i = games.findIndex((g) => String(g.universeId) === id);
    return cssVar(i >= 0 ? SERIES[i % SERIES.length] : '--series-other');
  };
  const bars = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const t0 = d.getTime(), t1 = t0 + DAY;
    const day = mine.filter((x) => x.t >= t0 && x.t < t1);
    bars.push({ t: t0, partial: i === 0, parts: ids.map((id) => ({ name: gameName.get(id) || 'Other', color: colorFor(id), v: sum(day.filter((x) => String(x.universeId) === id)) })) });
  }
  if (!rev.connected && !mine.length) $('rev-chart').innerHTML = '<div class="empty">No sales recorded yet.</div>';
  else barChart($('rev-chart'), bars, { height: 214, label: 'Robux per day', unit: 'Robux', sign: '' });

  // Top items over 30 days.
  const items = new Map();
  for (const x of d30) {
    const k = `${x.type}|${x.item}|${x.universeId}`;
    const e = items.get(k) || { ...x, robux: 0, count: 0 };
    e.robux += x.robux; e.count++;
    items.set(k, e);
  }
  const top = [...items.values()].sort((a, b) => b.robux - a.robux).slice(0, 6);
  const maxR = top[0] ? top[0].robux : 1;
  const iconOf = (x) => {
    const g = games.find((gg) => String(gg.universeId) === String(x.universeId));
    const all = g && g.store ? [...g.store.passes, ...g.store.products] : [];
    const hit = all.find((it) => it.id === x.itemId) || all.find((it) => it.name === x.item);
    return hit && hit.icon;
  };
  const icon = (x) => { const u = iconOf(x); return u ? `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'), { className: 'ph' }))">` : '<span class="ph"></span>'; };
  const typeName = (t) => ({ GamePass: 'Game pass', DeveloperProduct: 'Developer product', PrivateServer: 'Private server', Asset: 'Avatar item' }[t] || t || 'Item');
  $('rev-top').innerHTML = top.length ? top.map((x) => `<li>
      ${icon(x)}
      <span class="si"><b>${esc(x.item)}</b><span>${typeName(x.type)}${revGame === 'all' && gameName.get(String(x.universeId)) ? ` · ${esc(gameName.get(String(x.universeId)))}` : ''}</span>
        <i class="rank-bar"><i style="width:${((x.robux / maxR) * 100).toFixed(1)}%"></i></i></span>
      <span class="price num">${robux(x.robux)}<small>${x.count} sale${x.count === 1 ? '' : 's'}</small></span>
    </li>`).join('') : '<li class="faint">No sales in the last 30 days.</li>';

  $('rev-recent').innerHTML = mine.length ? mine.slice(0, 12).map((x) => `<li>
      ${icon(x)}
      <span class="si"><b>${esc(x.item)}</b><span>${revGame === 'all' ? esc(gameName.get(String(x.universeId)) || x.place || '') + ' · ' : ''}${agoIso(new Date(x.t).toISOString())}</span></span>
      <span class="price num">${x.pending ? '<em class="tag">Pending</em>' : ''}+${robux(x.robux)}</span>
    </li>`).join('') : '<li class="faint">No sales yet.</li>';
  renderSalesHeat(mine);
  renderPerVisit(revGame === 'all' ? games : games.filter((g) => String(g.universeId) === revGame), sales);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-rev]');
  if (!b) return;
  revGame = b.dataset.rev;
  store('rgo.revgame', revGame);
  renderRevenue(data.games);
});

// ================= more analytics: sales heatmap, earnings per visit, compare, reports =================
const sumR = (list) => list.reduce((s, x) => s + x.robux, 0);
const cleanName = (n) => n.replace(/\[[^\]]*\]\s*/g, '').trim() || n;

// Visits gained between two times, from the stored history.
function visitsBetween(g, from, to = Infinity) {
  const h = g.history.filter((p) => p[0] >= from && p[0] <= to && p[2] != null);
  return h.length > 1 ? h[h.length - 1][2] - h[0][2] : 0;
}
function avgPlayers(g, from, to) {
  const h = g.history.filter((p) => p[0] >= from && p[0] < to);
  return h.length ? h.reduce((s, p) => s + p[1], 0) / h.length : null;
}

// ---- sales heatmap (Monetization) ----
function renderSalesHeat(sales) {
  const box = $('rev-heat');
  if (!box) return;
  const sums = Array.from({ length: 7 }, () => new Array(24).fill(0));
  const counts = Array.from({ length: 7 }, () => new Array(24).fill(0));
  for (const x of sales) {
    const d = new Date(x.t), dow = (d.getDay() + 6) % 7, hr = d.getHours();
    sums[dow][hr] += x.robux; counts[dow][hr]++;
  }
  const max = Math.max(1, ...sums.flat());
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  let html = '<div class="heat"><span></span>';
  html += Array.from({ length: 24 }, (_, h) => `<span class="hl">${h % 3 === 0 ? hourName(h).replace(/\s/g, '').toLowerCase() : ''}</span>`).join('');
  sums.forEach((row, i) => {
    html += `<span class="dl">${days[i]}</span>`;
    row.forEach((v, h) => {
      const k = v / max;
      html += `<i class="cell${v ? '' : ' none'}${k > 0.55 ? ' hot' : ''}" style="--k:${(6 + k * 94).toFixed(0)}%" data-tip="${days[i]} ${hourName(h)} · ${v ? `R$ ${fmt.format(v)} from ${counts[i][h]} sale${counts[i][h] === 1 ? '' : 's'}` : 'no sales'}"></i>`;
    });
  });
  html += '</div><div class="heat-legend"><span>Less</span><i style="--k:6%"></i><i style="--k:35%"></i><i style="--k:65%"></i><i style="--k:100%"></i><span>More Robux</span></div><div class="tooltip"></div>';
  box.innerHTML = html;
  const tip = box.querySelector('.tooltip');
  box.querySelector('.heat').onpointermove = (e) => { const c = e.target.closest('.cell'); if (!c) { tip.style.display = 'none'; return; } tip.textContent = c.dataset.tip; placeTip(box, tip, e); };
  box.querySelector('.heat').onpointerleave = () => { tip.style.display = 'none'; };
  const best = sums.flatMap((row, i) => row.map((v, h) => [v, i, h])).sort((a, b) => b[0] - a[0])[0];
  $('rev-heat-meta').textContent = best && best[0] ? `Best: ${days[best[1]]} around ${hourName(best[2])}` : 'Your local time';
}

// ---- Robux per visit, per game (Monetization) ----
function renderPerVisit(games, sales) {
  const box = $('rev-pervisit');
  if (!box) return;
  const from = Date.now() - 30 * DAY;
  const rows = games.map((g) => {
    const s = sales.filter((x) => x.universeId === g.universeId && x.t >= from);
    const v = visitsBetween(g, from);
    return { g, visits: v, robux: sumR(s), sales: s.length };
  });
  const maxK = Math.max(0.0001, ...rows.map((r) => (r.visits ? r.robux / r.visits : 0)));
  box.innerHTML = `<table class="mini"><thead><tr><th>Experience</th><th>Visits</th><th>Robux</th><th>R$ per 1K visits</th><th>Buyers per 1K</th></tr></thead><tbody>${rows.map((r) => {
    const per = r.visits ? (r.robux / r.visits) * 1000 : null;
    return `<tr><td>${esc(cleanName(r.g.name))}</td><td>${fmt.format(r.visits)}</td><td>${robux(r.robux)}</td>
      <td><span class="cellbar"><i style="width:${per == null ? 0 : ((r.robux / r.visits) / maxK) * 100}%"></i></span>${per == null ? '—' : robux(per)}</td>
      <td>${r.visits ? ((r.sales / r.visits) * 1000).toFixed(1) : '—'}</td></tr>`;
  }).join('')}</tbody></table>
  <p class="est-note">Last 30 days, or since tracking began. Higher means each visit is worth more to you.</p>`;
}

// ---- Compare tab ----
function renderCompare(games) {
  if (!$('cmp-table')) return;
  const comps = data.competitors || [];
  const rows = [...games.map((g) => ({ g, mine: true })), ...comps.map((g) => ({ g, mine: false }))];
  const now = data.fetchedAt;
  const maxCcu = Math.max(1, ...rows.map((r) => r.g.playing));
  const logW = (v) => (v > 0 ? (Math.log10(v + 1) / Math.log10(maxCcu + 1)) * 100 : 0);
  const perDay = (g) => {
    const h = g.history.filter((p) => p[0] >= now - 7 * DAY);
    if (h.length < 2) return null;
    const days = (h[h.length - 1][0] - h[0][0]) / DAY;
    return days > 0.05 ? (h[h.length - 1][2] - h[0][2]) / days : null;
  };
  rows.sort((a, b) => b.g.playing - a.g.playing);
  $('cmp-table').innerHTML = `<thead><tr><th>Experience</th><th>Playing now</th><th>24h trend</th><th>24h peak</th><th>Visits/day</th><th>Visits</th><th>Favorites</th><th>Like ratio</th></tr></thead><tbody>${rows.map(({ g, mine }) => {
    const h24 = g.history.filter((p) => p[0] >= now - DAY);
    const pk = Math.max(g.playing, ...h24.map((p) => p[1]));
    const r = rating(g);
    const vpd = perDay(g);
    return `<tr class="${mine ? 'mine' : ''}">
      <td><div class="game">${g.icon ? `<img src="${esc(g.icon)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'), { className: 'noimg' }))">` : '<div class="noimg"></div>'}
        <div><a href="https://www.roblox.com/games/${g.placeId}" target="_blank" rel="noopener">${esc(g.name)}</a><div class="genre">${mine ? 'Yours' : esc(g.creator || 'Similar game')}</div></div></div></td>
      <td><span class="ccu-cell"><span class="cellbar wide"><i style="width:${logW(g.playing)}%"></i></span>${fmt.format(g.playing)}</span></td>
      <td>${sparkline(h24.map((p) => [p[0], p[1]]), 88, 24, mine ? cssVar('--ink') : cssVar('--ink-3')).replace('<svg', '<svg width="88" height="24"')}</td>
      <td>${fmt.format(pk)}</td>
      <td>${vpd == null ? '<span class="faint">collecting</span>' : fmt.format(Math.round(vpd))}</td>
      <td>${compact.format(g.visits)}</td>
      <td>${compact.format(g.favorites)}</td>
      <td>${r == null ? '—' : `${Math.round(r * 100)}%`}</td>
    </tr>`;
  }).join('')}</tbody>`;
  $('cmp-meta').textContent = comps.length ? `${comps.length} similar games · bars use a log scale so small and large games fit together` : 'Add similar games to config.json → "competitors" to compare.';
  // Your share of players among everything compared, right now.
  const total = rows.reduce((s, r) => s + r.g.playing, 0);
  const mineNow = games.reduce((s, g) => s + g.playing, 0);
  $('cmp-share').innerHTML = `
    <div class="kpi panel"><div class="label">Your players right now</div><div><span class="value num">${fmt.format(mineNow)}</span></div><div class="sub">${total ? `${((mineNow / total) * 100).toFixed(2)}% of everyone in these games` : ''}</div></div>
    <div class="kpi panel"><div class="label">Biggest game compared</div><div><span class="value num">${fmt.format(Math.max(0, ...comps.map((c) => c.playing)))}</span></div><div class="sub">${esc(cleanName((comps.slice().sort((a, b) => b.playing - a.playing)[0] || { name: '—' }).name))}</div></div>
    <div class="kpi panel"><div class="label">Your like ratio vs. theirs</div><div><span class="value num">${(() => { const mine = games.map(rating).filter((x) => x != null); const th = comps.map(rating).filter((x) => x != null); return mine.length && th.length ? `${Math.round((mine.reduce((a, b) => a + b, 0) / mine.length) * 100)}% / ${Math.round((th.reduce((a, b) => a + b, 0) / th.length) * 100)}%` : '—'; })()}</span></div><div class="sub">Average of your games / theirs</div></div>`;
}

// ---- Reports tab: weekly report, goals, update impact, export, alerts ----
function weekStats(games, sales, from, to) {
  let visits = 0, peak = 0;
  for (const g of games) {
    visits += visitsBetween(g, from, to);
    for (const p of g.history) if (p[0] >= from && p[0] < to) peak = Math.max(peak, p[1]);
  }
  const s = sales.filter((x) => x.t >= from && x.t < to);
  const items = new Map();
  for (const x of s) items.set(x.item, (items.get(x.item) || 0) + x.robux);
  const best = [...items].sort((a, b) => b[1] - a[1])[0];
  return { visits, peak, robux: sumR(s), sales: s.length, best };
}

function delta(a, b) {
  if (!b) return '<span class="faint">no data last week</span>';
  const pct = Math.round(((a - b) / b) * 100);
  return `<span class="delta ${pct >= 0 ? 'up' : 'down'}">${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct)}%</span> <span class="faint">vs ${fmt.format(Math.round(b))}</span>`;
}

const GOAL_METRICS = {
  visits: { label: 'Visits', value: (gs) => gs.reduce((s, g) => s + g.visits, 0), rate: (gs) => visitsPerDay(gs) },
  favorites: { label: 'Favorites', value: (gs) => gs.reduce((s, g) => s + g.favorites, 0), rate: (gs) => gs.reduce((s, g) => s + ratePerDay(g, 3), 0) },
  robux_month: { label: 'Robux this month', value: (gs, sales) => sumR(sales.filter((x) => x.t >= monthStart() && (gs.length > 1 || x.universeId === gs[0].universeId))), rate: (gs, sales) => { const days = (Date.now() - monthStart()) / DAY; return days > 0.1 ? GOAL_METRICS.robux_month.value(gs, sales) / days : 0; } },
  robux_total: { label: 'Robux total', value: (gs, sales) => sumR(gs.length > 1 ? sales : sales.filter((x) => x.universeId === gs[0].universeId)), rate: (gs, sales) => sumR((gs.length > 1 ? sales : sales.filter((x) => x.universeId === gs[0].universeId)).filter((x) => x.t >= Date.now() - 7 * DAY)) / 7 },
  peak: { label: 'Players at once', value: (gs) => Math.max(0, ...gs.flatMap((g) => g.history.map((p) => p[1])), gs.reduce((s, g) => s + g.playing, 0)), rate: () => 0 },
};
const monthStart = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
let localGoals = [];
try { localGoals = JSON.parse(load('rgo.goals') || '[]'); } catch { localGoals = []; }

function renderGoals(games, sales) {
  const goals = [...(data.goals || []).map((g) => ({ ...g, shared: true })), ...localGoals.map((g, i) => ({ ...g, idx: i }))];
  const ring = (k) => {
    const r = 26, c = 2 * Math.PI * r;
    return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--track)" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(Math.min(1, k) * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)" style="filter:drop-shadow(0 0 6px var(--glow))"/></svg>`;
  };
  $('goals').innerHTML = goals.length ? goals.map((goal) => {
    const m = GOAL_METRICS[goal.metric] || GOAL_METRICS.visits;
    const gs = goal.game ? games.filter((g) => String(g.universeId) === String(goal.game)) : games;
    if (!gs.length) return '';
    const cur = m.value(gs, sales), k = goal.target ? cur / goal.target : 0;
    const rate = m.rate(gs, sales);
    const left = goal.target - cur;
    const by = goal.by ? new Date(goal.by) : null;
    let pace = '';
    if (k >= 1) pace = '<span class="delta up">Reached 🎉</span>';
    else if (rate > 0) {
      const eta = new Date(Date.now() + (left / rate) * DAY);
      const ok = !by || eta <= by;
      pace = `${ok ? '<span class="delta up">On track</span>' : '<span class="delta down">Behind</span>'} <span class="faint">· at this pace ${new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: eta.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined }).format(eta)}</span>`;
    } else pace = '<span class="faint">Pace not known yet</span>';
    const fmtV = (v) => (goal.metric.startsWith('robux') ? robux(v) : fmt.format(Math.round(v)));
    return `<li>
      <div class="ring">${ring(k)}<b>${Math.min(100, Math.round(k * 100))}%</b></div>
      <div class="gtxt"><div class="gtitle">${esc(goal.title || `${fmtV(goal.target)} ${m.label.toLowerCase()}`)}</div>
        <div class="faint">${goal.game ? esc(cleanName(gs[0].name)) : 'All games'}${by ? ` · by ${new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' }).format(by)}` : ''}</div>
        <div class="gnum">${fmtV(cur)} <span class="faint">/ ${fmtV(goal.target)}</span></div><div class="gpace">${pace}</div></div>
      ${goal.shared ? '<span class="faint gtag">from config</span>' : `<button class="icon gdel" type="button" data-goal-del="${goal.idx}" aria-label="Remove goal">✕</button>`}
    </li>`;
  }).join('') : '<li class="faint">No goals yet. Add one below.</li>';
  $('goal-game').innerHTML = '<option value="">All games</option>' + games.map((g) => `<option value="${g.universeId}">${esc(cleanName(g.name))}</option>`).join('');
}

function renderUpdates(games, sales) {
  const now = Date.now();
  const rows = games.flatMap((g) => (g.updates || []).map((t) => ({ g, t }))).sort((a, b) => b.t - a.t).slice(0, 12);
  $('updates').innerHTML = rows.length ? `<table class="mini"><thead><tr><th>Update</th><th>Avg players</th><th>Visits/day</th><th>Robux/day</th></tr></thead><tbody>${rows.map(({ g, t }) => {
    const span = Math.min(7 * DAY, now - t);
    const ready = span >= DAY;
    const before = { p: avgPlayers(g, t - 7 * DAY, t), v: visitsBetween(g, t - 7 * DAY, t) / 7, r: sumR(sales.filter((x) => x.universeId === g.universeId && x.t >= t - 7 * DAY && x.t < t)) / 7 };
    const after = { p: avgPlayers(g, t, t + span), v: visitsBetween(g, t, t + span) / (span / DAY), r: sumR(sales.filter((x) => x.universeId === g.universeId && x.t >= t && x.t < t + span)) / (span / DAY) };
    const cell = (a, b, f) => {
      if (!ready) return '<span class="faint">wait a day</span>';
      if (a == null || b == null) return '<span class="faint">—</span>';
      const pct = b ? Math.round(((a - b) / b) * 100) : null;
      return `${f(a)} <span class="faint">vs ${f(b)}</span>${pct == null ? '' : ` <span class="delta ${pct >= 0 ? 'up' : 'down'}">${pct >= 0 ? '▲' : '▼'}${Math.abs(pct)}%</span>`}`;
    };
    const f1 = (v) => (v < 10 ? v.toFixed(1) : fmt.format(Math.round(v)));
    return `<tr><td><b>${esc(cleanName(g.name))}</b><div class="faint">${new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(t)}</div></td>
      <td>${cell(after.p, before.p, f1)}</td><td>${cell(after.v, before.v, f1)}</td><td>${cell(after.r, before.r, (v) => robux(v))}</td></tr>`;
  }).join('')}</tbody></table><p class="est-note">7 days after each update compared with the 7 days before (or as much as has passed). Updates are marked on the Overview players chart too.</p>` : '<p class="faint">No updates recorded yet. Each time you publish a game, it shows up here.</p>';
}

function renderReports(games) {
  if (!$('report')) return;
  const sales = (data.revenue && data.revenue.sales) || [];
  const now = Date.now();
  const cur = weekStats(games, sales, now - 7 * DAY, now), prev = weekStats(games, sales, now - 14 * DAY, now - 7 * DAY);
  const hasRev = data.revenue && (data.revenue.connected || sales.length);
  $('report').innerHTML = `
    <div><div class="k">Visits</div><div class="v">${fmt.format(cur.visits)}</div><div class="s">${delta(cur.visits, prev.visits)}</div></div>
    <div><div class="k">Peak players</div><div class="v">${fmt.format(cur.peak)}</div><div class="s">${delta(cur.peak, prev.peak)}</div></div>
    ${hasRev ? `<div><div class="k">Robux</div><div class="v">${robux(cur.robux)}</div><div class="s">${delta(cur.robux, prev.robux)}</div></div>
    <div><div class="k">Sales</div><div class="v">${fmt.format(cur.sales)}</div><div class="s">${delta(cur.sales, prev.sales)}</div></div>
    <div><div class="k">Best seller</div><div class="v small">${cur.best ? esc(cur.best[0]) : '—'}</div><div class="s">${cur.best ? robux(cur.best[1]) : 'No sales this week'}</div></div>` : ''}`;
  renderGoals(games, sales);
  renderUpdates(games, sales);
  const a = data.alerts || {};
  $('alerts-status').innerHTML = a.discord || a.ntfy
    ? `<span class="delta up">On</span> Sending to ${[a.discord && 'Discord', a.ntfy && 'the ntfy app'].filter(Boolean).join(' and ')}: new sales, player records, visit milestones, game updates, and this report every Monday.`
    : 'Off. Set it up below to get new sales, player records, visit milestones, game updates and a Monday report on your phone.';
  $('alerts-setup').hidden = !!(a.discord || a.ntfy);
}

// ---- export ----
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const csv = (rows) => rows.map((r) => r.map((v) => (/[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v)).join(',')).join('\n');

function exportSales() {
  const names = new Map(data.games.map((g) => [g.universeId, g.name]));
  const rows = [['time', 'experience', 'item', 'type', 'robux', 'pending']];
  for (const x of (data.revenue && data.revenue.sales) || []) rows.push([new Date(x.t).toISOString(), names.get(x.universeId) || 'Group store', x.item, x.type, x.robux, x.pending]);
  download('sales.csv', csv(rows), 'text/csv');
}
function exportDaily() {
  const rows = [['date', 'experience', 'visits_gained', 'avg_players', 'peak_players', 'robux']];
  const sales = (data.revenue && data.revenue.sales) || [];
  for (const g of data.games) {
    const gains = dailyGains(g);
    const days = new Set(g.history.map((p) => dayStart(p[0])));
    for (const d of [...days].sort()) {
      const h = g.history.filter((p) => p[0] >= d && p[0] < d + DAY);
      rows.push([new Date(d).toISOString().slice(0, 10), g.name, gains.get(d) || 0, (h.reduce((s, p) => s + p[1], 0) / h.length).toFixed(2), Math.max(...h.map((p) => p[1])), sumR(sales.filter((x) => x.universeId === g.universeId && x.t >= d && x.t < d + DAY))]);
    }
  }
  download('daily-stats.csv', csv(rows), 'text/csv');
}

document.addEventListener('click', (e) => {
  if (e.target.closest('#exp-sales')) exportSales();
  if (e.target.closest('#exp-daily')) exportDaily();
  if (e.target.closest('#exp-json')) download('dashboard-data.json', JSON.stringify(data, null, 2), 'application/json');
  const del = e.target.closest('[data-goal-del]');
  if (del) { localGoals.splice(Number(del.dataset.goalDel), 1); store('rgo.goals', JSON.stringify(localGoals)); renderReports(data.games); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'goal-form') return;
  e.preventDefault();
  const f = e.target;
  const target = Number(f.amount.value);
  if (!target) return;
  localGoals.push({ metric: f.metric.value, target, by: f.by.value || null, game: f.game.value || null });
  store('rgo.goals', JSON.stringify(localGoals));
  f.reset();
  renderReports(data.games);
});

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
loadStatic().then((ok) => {
  if (!ok) return refresh(true);
  const m = location.hash.match(/^#game-(\d+)$/);
  if (m) openGame(m[1], false);
});
