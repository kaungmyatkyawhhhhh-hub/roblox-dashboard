let rangeHours = 24;
const DAY = 24 * 60 * 60 * 1000;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let animateChart = false;      // draw chart lines in on the next render (first load, range change)
const kpiPrev = new Map();     // last shown KPI values, for count-up and change flashes
const ccuPrev = new Map();     // last shown players per experience

// ---- settings: URL query wins, then localStorage ----
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

// ---- intro: light beam → aperture → name → shutter opens onto the dashboard ----
const intro = (() => {
  const el = $('intro');
  const reduce = reduceMotion;
  let done = false, named = false;
  const setName = (text) => {
    $('intro-name').innerHTML = [...text].map((c, i) => (c === ' ' ? ' ' : `<span style="--i:${i}">${esc(c)}</span>`)).join('');
  };
  setName('Experience Overview');
  function finish() {
    if (done) return;
    done = true;
    document.body.classList.add('intro-reveal');
    el.classList.add('exit');
    requestAnimationFrame(() => document.body.classList.remove('intro-hold'));
    setTimeout(() => { el.hidden = true; document.body.classList.remove('intro-reveal'); }, 1300);
  }
  if (reduce) { el.hidden = true; document.body.classList.remove('intro-hold'); done = true; }
  else {
    // Always let the dashboard through: the intro never blocks for more than ~2.6s.
    setTimeout(finish, 2600);
    el.addEventListener('click', finish);
    addEventListener('keydown', finish, { once: true });
  }
  return {
    // Called once the data arrives; fills in the real name, logo and numbers.
    set(owner, ccu, visits) {
      if (done) return;
      if (!named && owner) {
        named = true;
        // Only swap the name if its letters haven't started appearing yet.
        if (performance.now() < 800) setName(owner.type === 'group' ? owner.name : owner.displayName || owner.name);
        if (owner.avatar) $('intro-logo').innerHTML = `<img src="${esc(owner.avatar)}" alt="" onerror="this.remove()">`;
      }
      countUp($('intro-ccu'), 0, ccu, (v) => fmt.format(Math.round(v)));
      countUp($('intro-visits'), 0, visits, (v) => compact.format(Math.round(v)));
    },
  };
})();
const qs = new URLSearchParams(location.search);
$('user').value = qs.get('user') ?? load('rgo.user') ?? '';
$('groups').value = qs.get('groups') ?? load('rgo.groups') ?? '';
const savedTheme = load('rgo.theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
rangeHours = Number(load('rgo.range')) || 24;

$('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  store('rgo.theme', document.documentElement.dataset.theme);
  render();
};

$('form').onsubmit = (e) => {
  e.preventDefault();
  store('rgo.user', $('user').value.trim());
  store('rgo.groups', $('groups').value.trim());
  const p = new URLSearchParams();
  if ($('user').value.trim()) p.set('user', $('user').value.trim());
  if ($('groups').value.trim()) p.set('groups', $('groups').value.trim());
  history.replaceState(null, '', `?${p}`);
  refresh(true);
};

function mountDashboard() {
  if ($('kpis')) return;
  $('main').replaceChildren($('dashboard').content.cloneNode(true));
  document.body.classList.add('mounted');
  observeReveals($('main'));
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tab === view));
  document.querySelectorAll('[data-view]').forEach((el) => { el.hidden = el.dataset.view !== view; });
  animateChart = true;
  $('filter').oninput = (e) => { filter = e.target.value.trim().toLowerCase(); render(); };
  $('range').hidden = !staticMode;
  if (!staticMode) rangeHours = 24;
  $('range').querySelectorAll('button').forEach((b) => {
    b.onclick = () => { rangeHours = Number(b.dataset.range); store('rgo.range', rangeHours); animateChart = true; render(); };
  });
}

function showOwners(owners, count) {
  const main = owners[0];
  $('owner').textContent = owners.map((o) => (o.type === 'group' ? o.name : o.displayName || o.name)).join(' · ');
  const kind = owners.length > 1 ? 'Roblox creators' : main.type === 'group' ? 'Roblox group' : `@${main.name}`;
  $('owner-sub').textContent = `${kind} · ${count} experience${count === 1 ? '' : 's'}`;
  if (main.avatar) {
    $('avatar').src = main.avatar;
    $('avatar').hidden = false;
    $('avatar').onerror = () => { $('avatar').hidden = true; };
  }
}

function setSync(html, state) {
  if (!$('kpis') && $('onboard')) $('onboard').querySelector('p').innerHTML = html;
  $('sync-text').innerHTML = html;
  $('sync').className = `pill ${state || ''}`;
}

function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)}h ago`;
}

async function loadStatic() {
  try {
    const res = await fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) return false;
    data = await res.json();
  } catch { return false; }
  staticMode = true;
  document.body.classList.add('static');
  mountDashboard();
  showOwners(data.owners, data.games.length);
  intro.set(data.owners[0], data.games.reduce((a, g) => a + g.playing, 0), data.games.reduce((a, g) => a + g.visits, 0));
  setSync(`Updated ${ago(data.fetchedAt)}`, 'ok');
  render();
  timer = setTimeout(loadStatic, 5 * 60 * 1000);
  if (data.liveProxy) pollLive();
  return true;
}

// Live mode: when config.json names a liveProxy (see worker/worker.js), poll it
// for current numbers between the scheduled 15-minute snapshots.
const LIVE_MS = 15 * 1000;
const livePoints = new WeakSet();
let liveTimer = null;
let lastLiveSig = '', lastLiveRender = 0;

async function pollLive() {
  clearTimeout(liveTimer);
  liveTimer = setTimeout(pollLive, LIVE_MS);
  if (document.hidden || !data || !data.liveProxy) return;
  try {
    const ids = data.games.map((g) => g.universeId).join(',');
    const res = await fetch(`${data.liveProxy.replace(/\/$/, '')}/live?ids=${ids}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const live = await res.json();
    const now = live.fetchedAt || Date.now();
    const byId = new Map(live.games.map((g) => [g.universeId, g]));
    const sig = live.games.map((g) => [g.universeId, g.playing, g.visits, g.favorites, g.upVotes, g.downVotes].join(':')).join('|');
    const changed = sig !== lastLiveSig || now - lastLiveRender > 120000;
    lastLiveSig = sig;
    for (const g of data.games) {
      const l = byId.get(g.universeId);
      if (!l) continue;
      Object.assign(g, { playing: l.playing, visits: l.visits, favorites: l.favorites, upVotes: l.upVotes, downVotes: l.downVotes });
      // Extend the chart with at most one live point per minute.
      const last = g.history[g.history.length - 1];
      if (last && livePoints.has(last) && now - last[0] < 60000) last.splice(1, 2, l.playing, l.visits);
      else { const p = [now, l.playing, l.visits]; livePoints.add(p); g.history.push(p); }
    }
    data.fetchedAt = now;
    if (changed) { render(); lastLiveRender = now; }
    setSync(`<b>Live</b> · ${secFmt.format(now)}`, 'live');
  } catch {
    setSync(`Updated ${ago(data.fetchedAt)} · live paused`, 'ok');
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && staticMode) pollLive(); });

async function refresh(showLoading) {
  clearTimeout(timer);
  const user = $('user').value.trim();
  const groups = $('groups').value.trim();
  if (!user && !groups) return;
  if (showLoading) setSync('Loading…');
  try {
    const res = await fetch(`/api/overview?${new URLSearchParams({ user, groups })}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    data = body;
    mountDashboard();
    showOwners(body.owners, body.games.length);
    setSync(`Synced ${timeFmt.format(body.fetchedAt)}`, 'ok');
    render();
  } catch (e) {
    setSync(`Sync failed: ${esc(e.message)}`, 'err');
  }
  timer = setTimeout(refresh, REFRESH_MS);
}

// ---- derived numbers ----
const rating = (g) => (g.upVotes + g.downVotes ? g.upVotes / (g.upVotes + g.downVotes) : null);
const within = (g, hours) => g.history.filter((h) => h[0] >= data.fetchedAt - hours * 3600000);
const last24 = (g) => within(g, 24);
const peak = (g) => Math.max(g.playing, ...last24(g).map((h) => h[1]));
const visitsGained = (g) => { const h = last24(g); return h.length ? g.visits - h[0][2] : 0; };
const genreLine = (g) => [g.genre && g.genre !== 'All' ? g.genre : '', g.ownerType === 'group' && data.owners.length > 1 ? g.ownerName : ''].filter(Boolean).join(' · ') || 'Roblox experience';

// Sum player counts across games, bucketed to the minute.
function totalSeries(games, hours = 24) {
  const buckets = new Map();
  for (const g of games) {
    const seen = new Map();
    for (const [t, p] of within(g, hours)) seen.set(Math.round(t / 60000) * 60000, p);
    for (const [t, p] of seen) buckets.set(t, (buckets.get(t) || 0) + p);
  }
  return [...buckets].sort((a, b) => a[0] - b[0]);
}

// Smooth path through points without overshooting (monotone cubic interpolation).
function smoothPath(pts) {
  const n = pts.length;
  if (n < 2) return '';
  if (n === 2) return `M${pts[0][0]},${pts[0][1]}L${pts[1][0]},${pts[1][1]}`;
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = dx[i] ? (pts[i + 1][1] - pts[i][1]) / dx[i] : 0; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (3 * (dx[i - 1] + dx[i])) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(pts[i][0] + h).toFixed(1)},${(pts[i][1] + t[i] * h).toFixed(1)} ${(pts[i + 1][0] - h).toFixed(1)},${(pts[i + 1][1] - t[i + 1] * h).toFixed(1)} ${pts[i + 1][0].toFixed(1)},${pts[i + 1][1].toFixed(1)}`;
  }
  return d;
}

let gradId = 0;
// Small area chart. Lines are scaled so a quiet game doesn't look like a spike.
function sparkline(points, w, h, color, cls = '') {
  const id = `sg${gradId++}`;
  if (points.length < 2) return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${h - 1.5}" y2="${h - 1.5}" stroke="var(--line)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
  points = bucketize(points, 72);
  const t0 = points[0][0], t1 = points[points.length - 1][0];
  const max = Math.max(4, ...points.map((p) => p[1]));
  const xy = points.map((p) => [((p[0] - t0) / (t1 - t0 || 1)) * w, h - 2 - (p[1] / max) * (h - 6)]);
  const d = smoothPath(xy);
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L${w},${h}L0,${h}Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function render() {
  if (!data || !$('kpis')) return;
  gradId = 0;
  const games = data.games;
  const ranked = [...games].sort((a, b) => b.playing - a.playing || b.visits - a.visits);
  const top = ranked.slice(0, 5);
  const colorOf = new Map(top.map((g, i) => [g.universeId, SERIES[i]]));
  const rankOf = new Map(ranked.map((g, i) => [g.universeId, i + 1]));
  renderKpis(games);
  renderChart(games, top, colorOf);
  renderHeatmap(games);
  renderHighlights(games);
  barChart($('visits'), visitBars(games, colorOf, 14), { label: 'Visits per day', height: 158 });
  $('milestones').innerHTML = milestoneHtml(milestoneRows(games).slice(0, 3)) || '<li class="faint">Every milestone reached. Legendary.</li>';
  renderCards(ranked, colorOf);
  if (view === 'money') renderMoney(games);
  if (view === 'compare') renderCompare(games);
  if (view === 'reports') renderReports(games);
  renderDrawer();
  const ccu = games.reduce((s, g) => s + g.playing, 0);
  document.title = `${ccu ? `(${fmt.format(ccu)}) ` : ''}${data.owners.map((o) => o.name).join(', ')} · Experience Overview`;
  $('table-panel').hidden = games.length <= CARD_LIMIT;
  if (games.length > CARD_LIMIT) renderTable(games, colorOf, rankOf);
}

function renderKpis(games) {
  const playing = games.reduce((s, g) => s + g.playing, 0);
  const visits = games.reduce((s, g) => s + g.visits, 0);
  const gained = games.reduce((s, g) => s + visitsGained(g), 0);
  const favs = games.reduce((s, g) => s + g.favorites, 0);
  const up = games.reduce((s, g) => s + g.upVotes, 0);
  const down = games.reduce((s, g) => s + g.downVotes, 0);
  const live = games.filter((g) => g.playing > 0).length;
  const total = totalSeries(games);
  const peakTotal = Math.max(playing, ...total.map((p) => p[1]));
  const tiles = [
    { cls: 'hero-kpi', label: 'Playing right now', n: playing, f: (v) => fmt.format(Math.round(v)), sub: `24h peak <b>${fmt.format(peakTotal)}</b> · ${live} of ${games.length} live`, extra: sparkline(total, 400, 52, cssVar('--accent'), 'spark') },
    { label: 'Total visits', n: visits, f: (v) => compact.format(Math.round(v)), sub: gained > 0 ? `<span class="pos">+${fmt.format(gained)}</span> in 24h` : fmt.format(visits) },
    { label: 'Favorites', n: favs, f: (v) => compact.format(Math.round(v)), sub: `${fmt.format(favs)} total` },
    { label: 'Like ratio', n: up + down ? (up / (up + down)) * 100 : null, f: (v) => `${Math.round(v)}%`, sub: `${compact.format(up)} likes · ${compact.format(down)} dislikes` },
    { label: 'Experiences', n: games.length, f: (v) => fmt.format(Math.round(v)), sub: `${live} with players` },
  ];
  $('kpis').innerHTML = tiles.map((t, i) => `
    <div class="panel kpi ${t.cls || ''}" style="--i:${i}">
      <div class="label">${t.label}</div>
      <div><span class="value num">${t.n == null ? '—' : t.f(kpiPrev.has(t.label) ? kpiPrev.get(t.label) : 0)}</span></div>
      <div class="sub num">${t.sub}</div>
      ${t.extra || ''}
    </div>`).join('');
  $('kpis').querySelectorAll('.value').forEach((el, i) => {
    const t = tiles[i];
    if (t.n == null) return;
    const seen = kpiPrev.has(t.label);
    const from = seen ? kpiPrev.get(t.label) : 0;
    kpiPrev.set(t.label, t.n);
    if (seen && from !== t.n) el.classList.add(t.n > from ? 'flash-up' : 'flash-down');
    countUp(el, from, t.n, t.f);
  });
}

// Animate a number from one value to another (easeOutCubic).
function countUp(el, from, to, f) {
  if (reduceMotion || from === to) { el.textContent = f(to); return; }
  const start = performance.now(), dur = from === 0 ? 1200 : 700;
  const step = (now) => {
    const k = Math.min(1, (now - start) / dur), e = 1 - (1 - k) ** 3;
    el.textContent = f(from + (to - from) * e);
    if (k < 1 && el.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function renderChart(games, top, colorOf) {
  const topIds = new Set(top.map((g) => g.universeId));
  const others = games.filter((g) => !topIds.has(g.universeId));
  $('range').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', Number(b.dataset.range) === rangeHours));
  const step = staticMode ? `${data.intervalMinutes || 5}-min samples` : '1-min samples';
  // Until tracking covers the chosen range, say where the data actually starts.
  const firstT = Math.min(...games.flatMap((g) => (g.history[0] ? [g.history[0][0]] : [])));
  const since = isFinite(firstT) && data.fetchedAt - firstT < rangeHours * 3600000 * 0.9
    ? `Since ${data.fetchedAt - firstT > DAY ? dayFmt.format(firstT) + ', ' : ''}${timeFmt.format(firstT)}` : RANGE_NAMES[rangeHours];
  $('chart-meta').textContent = `${since} · ${step}`;
  const series = top.filter((g) => within(g, rangeHours).length).map((g) => ({
    name: g.name, color: cssVar(colorOf.get(g.universeId)), dash: DASHES[SERIES.indexOf(colorOf.get(g.universeId))], points: within(g, rangeHours).map((h) => [h[0], h[1]]),
  }));
  if (others.length) {
    const pts = totalSeries(others, rangeHours);
    if (pts.length) series.push({ name: `All others (${others.length})`, color: cssVar('--series-other'), dash: '1 5', points: pts });
  }
  const markers = games.flatMap((g) => (g.updates || []).map((t) => ({ t, label: 'Update', title: `${g.name} updated ${new Date(t).toLocaleString()}` })));
  lineChart($('chart'), series, { markers, animate: animateChart, height: innerWidth < 600 ? 190 : 200, label: `Concurrent users, ${RANGE_NAMES[rangeHours].toLowerCase()}` });
  animateChart = false;
}

const RANGE_NAMES = { 12: 'Last 12 hours', 24: 'Last 24 hours', 168: 'Last 7 days', 720: 'Last 30 days' };
const EMPTY_LINE = 'Collecting samples. This chart fills in after the next couple of updates.';
const hourName = (h) => new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).format(new Date(2026, 0, 1, h));
const avgText = (v) => (v < 10 ? v.toFixed(1) : fmt.format(Math.round(v)));

// Average points into at most n time buckets, so dense, small integer counts
// read as a smooth trend instead of a comb. Keeps the last point exact.
function bucketize(points, n) {
  if (points.length <= n) return points;
  const t0 = points[0][0], span = points[points.length - 1][0] - t0 || 1;
  const out = [];
  let cur = null;
  for (const [t, v] of points) {
    const b = Math.min(n - 1, Math.floor(((t - t0) / span) * n));
    if (!cur || cur.b !== b) { if (cur) out.push([cur.t / cur.c, cur.v / cur.c]); cur = { b, t: 0, v: 0, c: 0 }; }
    cur.t += t; cur.v += v; cur.c++;
  }
  out.push([cur.t / cur.c, cur.v / cur.c]);
  out[out.length - 1] = points[points.length - 1];
  return out;
}
const numText = (v) => (Number.isInteger(v) ? fmt.format(v) : v.toFixed(1));

// Multi-series line chart with gradient fills, crosshair and tooltip.
// series: [{ name, color, points: [[time, value], ...] }]
function lineChart(box, series, { animate = false, label = '', height, floor = 4, legend = true, markers = [] } = {}) {
  const all = series.flatMap((s) => s.points);
  const t0 = Math.min(...all.map((p) => p[0])), t1 = Math.max(...all.map((p) => p[0]));
  if (!series.length || t1 - t0 < 60000) { box.innerHTML = `<div class="empty">${EMPTY_LINE}</div>`; return; }
  const W = Math.max(260, box.clientWidth - 44), H = height || (W < 520 ? 220 : 280);
  series = series.map((s) => ({ ...s, points: bucketize(s.points, Math.max(40, Math.floor(W / 10))) }));
  const m = { l: 40, r: 8, t: 16, b: 30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = all.map((p) => p[1]);
  // A floor on the scale keeps one or two players from filling the whole chart.
  // floor: null fits the scale to the data instead (for totals like favorites).
  let lo = 0, hi = Math.max(floor || 0, ...vals);
  if (floor === null) { lo = Math.min(...vals); hi = Math.max(lo + 4, ...vals); }
  const yStep = Math.max(1, niceStep((hi - lo) / 4));
  const yMin = Math.floor(lo / yStep) * yStep, yMax = Math.ceil(hi / yStep) * yStep;
  const x = (t) => m.l + ((t - t0) / (t1 - t0)) * iw;
  const y = (v) => m.t + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;
  const id = `${box.id || 'c'}-${gradId++}`;

  let grid = '';
  for (let v = yMin; v <= yMax; v += yStep) {
    grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v !== yMin ? 'stroke-dasharray="2 4"' : ''}/>`;
    grid += `<text x="${m.l - 12}" y="${y(v) + 4}" text-anchor="end">${compact.format(v)}</text>`;
  }
  const multiDay = t1 - t0 > 1.5 * DAY;
  const ticks = Math.max(2, Math.min(6, Math.floor(iw / 110)));
  let lastLabel = '';
  for (let i = 0; i <= ticks; i++) {
    const t = t0 + ((t1 - t0) * i) / ticks;
    const lbl = multiDay ? dayFmt.format(t) : timeFmt.format(t);
    if (lbl === lastLabel) continue;
    lastLabel = lbl;
    grid += `<text x="${x(t)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === ticks ? 'end' : 'middle'}">${lbl}</text>`;
  }
  const liveNow = $('sync') && $('sync').classList.contains('live');
  const glow = `<filter id="${id}glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feComponentTransfer in="b" result="g"><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  const defs = glow + series.map((s, i) => `<linearGradient id="${id}g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".24"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('');
  const shapes = series.map((s, i) => {
    const pts = s.points.map((p) => [x(p[0]), y(p[1])]);
    if (pts.length < 2) return '';
    const d = smoothPath(pts);
    const last = pts[pts.length - 1];
    return `<path class="area" d="${d}L${last[0]},${y(yMin)}L${pts[0][0]},${y(yMin)}Z" fill="url(#${id}g${i})"/>
      <path class="line" d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" filter="url(#${id}glow)"${s.dash ? ` style="stroke-dasharray:${s.dash}"` : ''}/>
      <g class="end">${liveNow ? `<circle class="ping" cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${s.color}"/>` : ''}
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/></g>`;
  }).join('');

  box.innerHTML = `
    ${legend ? `<div class="legend">${series.map((s) => `<span><svg class="key-line" width="20" height="6" aria-hidden="true"><line x1="1" y1="3" x2="19" y2="3" stroke="${s.color}" stroke-width="2" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/></svg><em>${esc(s.name)}</em></span>`).join('')}</div>` : ''}
    <svg class="${animate ? 'draw' : ''}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}" style="display:block;margin-top:10px;overflow:visible">
      <defs>${defs}</defs>
      <g class="axis">${grid}</g>
      ${shapes}
      ${markers.filter((k) => k.t >= t0 && k.t <= t1).map((k) => `<g class="marker"><line x1="${x(k.t)}" x2="${x(k.t)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 3"/><text x="${x(k.t) + 4}" y="${m.t + 10}">${esc(k.label)}</text><title>${esc(k.title || k.label)}</title></g>`).join('')}
      <line class="xhair" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      <g class="dots"></g>
      <rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg>
    <div class="tooltip"></div>`;

  if (animate) box.querySelectorAll('.line').forEach((l) => l.style.setProperty('--len', Math.ceil(l.getTotalLength()) + 1));
  const hit = box.querySelector('.hit'), tip = box.querySelector('.tooltip');
  const xh = box.querySelector('.xhair'), dots = box.querySelector('.dots');
  const nearest = (pts, t) => pts.reduce((best, p) => (Math.abs(p[0] - t) < Math.abs(best[0] - t) ? p : best), pts[0]);
  hit.onpointermove = (e) => {
    const r = hit.getBoundingClientRect();
    const t = t0 + ((e.clientX - r.left) / r.width) * (t1 - t0);
    const rows = series.filter((s) => s.points.length).map((s) => ({ s, p: nearest(s.points, t) })).sort((a, b) => b.p[1] - a.p[1]);
    const px = x(rows[0].p[0]);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
    dots.innerHTML = rows.map(({ s, p }) => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4.5" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`).join('');
    const when = new Date(rows[0].p[0]);
    tip.innerHTML = `<div class="when">${multiDay ? `${dayFmt.format(when)}, ` : ''}${timeFmt.format(when)}</div>` +
      rows.map(({ s, p }) => `<div class="row"><span><i class="key" style="background:${s.color}"></i>${esc(s.name)}</span><b>${numText(p[1])}</b></div>`).join('');
    placeTip(box, tip, e);
  };
  hit.onpointerleave = () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); dots.innerHTML = ''; };
}

function placeTip(box, tip, e) {
  tip.style.display = 'block';
  const bx = box.getBoundingClientRect();
  let left = e.clientX - bx.left + 18;
  if (left + tip.offsetWidth > bx.width) left = e.clientX - bx.left - tip.offsetWidth - 18;
  tip.style.left = `${Math.max(0, left)}px`;
  tip.style.top = `${Math.max(0, e.clientY - bx.top - tip.offsetHeight - 12)}px`;
}

// ---- daily visits ----
const dayStart = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

// Visits gained per local calendar day: Map(dayStartMs -> visits).
function dailyGains(g) {
  const lastOfDay = new Map();
  const firstOfDay = new Map();
  for (const h of g.history) {
    if (h[2] == null) continue;
    const d = dayStart(h[0]);
    if (!firstOfDay.has(d)) firstOfDay.set(d, h[2]);
    lastOfDay.set(d, h[2]);
  }
  const days = [...lastOfDay.keys()].sort((a, b) => a - b);
  const out = new Map();
  days.forEach((d, i) => {
    const base = i ? lastOfDay.get(days[i - 1]) : firstOfDay.get(d);
    out.set(d, Math.max(0, lastOfDay.get(d) - base));
  });
  return out;
}

function roundTop(x, y, w, h, r) {
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

// Stacked daily bars. bars: [{ t, partial, parts: [{ name, color, v }] }]
function barChart(box, bars, { height = 200, label = '', xLabel = (b) => dayFmt.format(b.t), tipTitle = null, unit = 'Visits', sign = '+' } = {}) {
  const totals = bars.map((b) => b.parts.reduce((s, p) => s + p.v, 0));
  if (!bars.length || totals.every((v) => !v)) { box.innerHTML = `<div class="empty">No visits recorded yet. Daily bars appear as visits come in.</div>`; return; }
  const W = Math.max(260, box.clientWidth - 44), H = height;
  const m = { l: 40, r: 4, t: 12, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const top = Math.max(4, ...totals);
  const yStep = Math.max(1, niceStep(top / 4));
  const yMax = Math.ceil(top / yStep) * yStep;
  const y = (v) => m.t + ih - (v / yMax) * ih;
  const slot = iw / bars.length, bw = Math.max(3, Math.min(28, slot * 0.62));
  let grid = '';
  for (let v = 0; v <= yMax; v += yStep) {
    grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v ? 'stroke-dasharray="2 4"' : ''}/>`;
    grid += `<text x="${m.l - 12}" y="${y(v) + 4}" text-anchor="end">${compact.format(v)}</text>`;
  }
  const every = Math.ceil(bars.length / Math.max(2, Math.floor(iw / 70)));
  let rects = '';
  bars.forEach((b, i) => {
    const cx = m.l + slot * (i + 0.5);
    const last = i === bars.length - 1 && i % every >= every / 2;
    if (i % every === 0 || last) grid += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(xLabel(b))}</text>`;
    const parts = b.parts.filter((p) => p.v);
    let acc = 0;
    parts.forEach((p, j) => {
      const top = y(acc + p.v), bottom = y(acc) - (acc ? 2 : 0); // 2px surface gap between segments
      const h = Math.max(1, bottom - top);
      const d = j === parts.length - 1 ? roundTop(cx - bw / 2, top, bw, h, Math.min(4, bw / 2, h)) : `M${cx - bw / 2},${top}h${bw}v${h}h${-bw}Z`;
      rects += `<path class="bar${b.partial ? ' partial' : ''}" style="--i:${i}" d="${d}" fill="${p.color}"/>`;
      acc += p.v;
    });
    rects += `<rect class="bar-hit" data-i="${i}" x="${m.l + slot * i}" y="${m.t}" width="${slot}" height="${ih}" fill="transparent"/>`;
  });
  const bid = `${box.id || 'b'}-${gradId++}`;
  box.innerHTML = `<svg class="bars" width="${W}" height="${H}" role="img" aria-label="${esc(label)}" style="display:block;overflow:visible"><defs><filter id="${bid}glow" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feComponentTransfer in="b" result="s"><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g class="axis">${grid}</g><g filter="url(#${bid}glow)">${rects}</g></svg><div class="tooltip"></div>`;
  const tip = box.querySelector('.tooltip');
  const dayLong = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
  box.querySelectorAll('.bar-hit').forEach((r) => {
    r.onpointermove = (e) => {
      const b = bars[Number(r.dataset.i)];
      const parts = b.parts.filter((p) => p.v);
      tip.innerHTML = `<div class="when">${tipTitle ? esc(tipTitle(b)) : dayLong.format(b.t)}${b.partial ? ' · so far' : ''}</div>` +
        (parts.length > 1 ? parts.map((p) => `<div class="row"><span><i class="key" style="background:${p.color}"></i>${esc(p.name)}</span><b>${sign}${fmt.format(p.v)}</b></div>`).join('') : '') +
        `<div class="row"><span>${unit}</span><b>${sign}${fmt.format(parts.reduce((s, p) => s + p.v, 0))}</b></div>`;
      placeTip(box, tip, e);
    };
    r.onpointerleave = () => { tip.style.display = 'none'; };
  });
}

function visitBars(games, colorOf, days) {
  const gains = games.map((g) => ({ g, m: dailyGains(g) }));
  const today = dayStart(Date.now());
  const bars = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const t = d.getTime();
    bars.push({
      t, partial: i === 0,
      parts: gains.map(({ g, m }) => ({ name: g.name, color: cssVar(colorOf.get(g.universeId) || '--series-other'), v: m.get(t) || 0 })),
    });
  }
  // Drop days from before tracking started.
  const firstTracked = Math.min(...games.map((g) => (g.history[0] ? dayStart(g.history[0][0]) : Infinity)));
  return bars.filter((b) => b.t >= firstTracked);
}

// ---- when players are online ----
function renderHeatmap(games) {
  const box = $('heatmap');
  const sums = Array.from({ length: 7 }, () => new Array(24).fill(0));
  const counts = Array.from({ length: 7 }, () => new Array(24).fill(0));
  for (const [t, p] of totalSeries(games, 720)) {
    const d = new Date(t), dow = (d.getDay() + 6) % 7, hr = d.getHours();
    sums[dow][hr] += p; counts[dow][hr]++;
  }
  let max = 0, filled = 0;
  const avg = sums.map((row, i) => row.map((s, j) => {
    if (!counts[i][j]) return null;
    filled++;
    const a = s / counts[i][j];
    max = Math.max(max, a);
    return a;
  }));
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  $('heat-meta').textContent = filled < 7 * 24 ? `Fills in over the first week · ${Math.round((filled / 168) * 100)}% covered` : 'Average players, your local time';
  let html = '<div class="heat"><span></span>';
  html += Array.from({ length: 24 }, (_, h) => `<span class="hl">${h % 3 === 0 ? hourName(h).replace(/\s/g, '').toLowerCase() : ''}</span>`).join('');
  avg.forEach((row, i) => {
    html += `<span class="dl">${days[i]}</span>`;
    row.forEach((v, h) => {
      const k = v == null || !max ? 0 : v / max;
      html += `<i class="cell${v == null ? ' none' : ''}${k > 0.55 ? ' hot' : ''}" style="--k:${(6 + k * 94).toFixed(0)}%;--d:${(i * 24 + h) * 4}ms" data-tip="${days[i]} ${hourName(h)} · ${v == null ? 'no data yet' : `${avgText(v)} players on average`}"></i>`;
    });
  });
  html += '</div><div class="heat-legend"><span>Fewer</span><i style="--k:6%"></i><i style="--k:35%"></i><i style="--k:65%"></i><i style="--k:100%"></i><span>More players</span></div><div class="tooltip"></div>';
  box.innerHTML = html;
  const tip = box.querySelector('.tooltip');
  const heat = box.querySelector('.heat');
  heat.onpointermove = (e) => {
    const c = e.target.closest('.cell');
    if (!c) { tip.style.display = 'none'; return; }
    tip.textContent = c.dataset.tip;
    placeTip(box, tip, e);
  };
  heat.onpointerleave = () => { tip.style.display = 'none'; };
}

// ---- highlights ----
function renderHighlights(games) {
  const total = totalSeries(games, 720);
  const byHour = Array.from({ length: 24 }, () => [0, 0]);
  const byDay = Array.from({ length: 7 }, () => [0, 0]);
  const dayKeys = new Set();
  for (const [t, p] of total) {
    const d = new Date(t);
    byHour[d.getHours()][0] += p; byHour[d.getHours()][1]++;
    byDay[d.getDay()][0] += p; byDay[d.getDay()][1]++;
    dayKeys.add(dayStart(t));
  }
  const best = (arr) => arr.reduce((b, [s, c], i) => (c && s / c > b.v ? { i, v: s / c } : b), { i: -1, v: 0 });
  const bh = best(byHour), bd = best(byDay);
  const peakPt = total.reduce((b, p) => (p[1] > b[1] ? p : b), [0, 0]);
  const dayName = (d) => new Intl.DateTimeFormat(undefined, { weekday: 'long' }).format(new Date(2026, 0, 4 + d));
  const spanH = total.length ? (total[total.length - 1][0] - total[0][0]) / 3600000 : 0;

  // Visits per day over the last 7 complete days.
  const today = dayStart(Date.now());
  const gainsAll = games.map(dailyGains);
  let vSum = 0, vDays = 0;
  for (let i = 1; i <= 7; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const vals = gainsAll.map((m) => m.get(d.getTime())).filter((v) => v != null);
    if (vals.length) { vSum += vals.reduce((a, b) => a + b, 0); vDays++; }
  }
  const perDay = vDays ? vSum / vDays : games.reduce((s, g) => s + visitsGained(g), 0);

  // Most played over 7 days, by player-hours.
  const mostPlayed = games.map((g) => {
    const h = within(g, 168);
    let area = 0;
    for (let i = 1; i < h.length; i++) area += ((h[i][1] + h[i - 1][1]) / 2) * ((h[i][0] - h[i - 1][0]) / 3600000);
    return { g, area };
  }).sort((a, b) => b.area - a.area)[0];

  const whenFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const rows = [
    spanH >= 12 && bh.v > 0
      ? { icon: '⏰', label: 'Busiest hour', value: hourName(bh.i), sub: `${avgText(bh.v)} players on average` }
      : { icon: '⏰', label: 'Busiest hour', value: 'Collecting…', sub: 'Needs about 12 hours of data' },
    dayKeys.size >= 3 && bd.v > 0
      ? { icon: '📅', label: 'Busiest day', value: dayName(bd.i), sub: `${avgText(bd.v)} players on average` }
      : { icon: '📅', label: 'Busiest day', value: 'Collecting…', sub: 'Needs a few days of data' },
    { icon: '🏆', label: 'Peak since tracking began', value: `${fmt.format(peakPt[1])} player${peakPt[1] === 1 ? '' : 's'}`, sub: peakPt[1] > 0 ? whenFmt.format(peakPt[0]) : 'No players recorded yet' },
    { icon: '📈', label: 'Visits per day', value: fmt.format(Math.round(perDay)), sub: vDays ? `Average of the last ${vDays} day${vDays === 1 ? '' : 's'}` : 'Last 24 hours' },
    mostPlayed && mostPlayed.area > 0
      ? { icon: '🔥', label: 'Most played this week', value: mostPlayed.g.name, sub: `${avgText(mostPlayed.area)} player-hours` }
      : { icon: '🔥', label: 'Most played this week', value: '—', sub: 'No playtime recorded yet' },
  ];
  $('highlights').innerHTML = rows.map((r) => `<li><span class="hi-icon" aria-hidden="true">${r.icon}</span><div class="hi-text"><div class="hi-label">${r.label}</div><div class="hi-value">${esc(r.value)}</div><div class="hi-sub">${esc(r.sub)}</div></div></li>`).join('');
}

// ---- milestones ----
const MILESTONES = [10, 25, 50, 100, 250, 500, 1e3, 2.5e3, 5e3, 1e4, 2.5e4, 5e4, 1e5, 2.5e5, 5e5, 1e6, 2.5e6, 5e6, 1e7, 2.5e7, 5e7, 1e8, 1e9];

// Daily growth of a history column (2 = visits, 3 = favorites) over the last 7 days.
function ratePerDay(g, col) {
  const h = within(g, 168).filter((p) => p[col] != null);
  if (h.length < 2) return 0;
  const days = (h[h.length - 1][0] - h[0][0]) / DAY;
  return days > 0.04 ? (h[h.length - 1][col] - h[0][col]) / days : 0;
}

function milestoneRows(games, { includeTotal = true } = {}) {
  const rows = [];
  const add = (name, what, value, rate) => {
    const next = MILESTONES.find((m) => m > value);
    if (!next) return;
    const prev = [...MILESTONES].reverse().find((m) => m <= value) || 0;
    rows.push({ name, what, value, next, k: (value - prev) / (next - prev), eta: rate > 0 ? (next - value) / rate : null });
  };
  if (includeTotal && games.length > 1) add('All experiences', 'visits', games.reduce((s, g) => s + g.visits, 0), games.reduce((s, g) => s + ratePerDay(g, 2), 0));
  for (const g of games) {
    add(g.name, 'visits', g.visits, ratePerDay(g, 2));
    add(g.name, 'favorites', g.favorites, ratePerDay(g, 3));
  }
  return rows.sort((a, b) => b.k - a.k);
}

function milestoneHtml(rows) {
  const eta = (d) => {
    if (d == null) return 'Pace not known yet';
    if (d < 1) return 'Less than a day at this pace';
    if (d < 60) return `About ${Math.round(d)} day${Math.round(d) === 1 ? '' : 's'} at this pace`;
    return 'Over 2 months at this pace';
  };
  return rows.map((r) => `<li>
    <div class="ms-top"><span class="ms-name">${esc(r.name)} <span class="faint">· ${r.what}</span></span><span class="num ms-val"><b>${compact.format(r.value)}</b> <span class="faint">/ ${compact.format(r.next)}</span></span></div>
    <div class="ms-bar"><i style="--w:${(r.k * 100).toFixed(1)}%"></i></div>
    <div class="ms-sub">${Math.round(r.k * 100)}% there · ${eta(r.eta)}</div>
  </li>`).join('');
}

// ---- experience detail drawer ----
let openId = null;

function openGame(id, push = true) {
  const g = data && data.games.find((x) => String(x.universeId) === String(id));
  if (!g) return;
  const wasOpen = openId != null;
  openId = g.universeId;
  if (push) history.replaceState(null, '', `#game-${g.universeId}`);
  document.body.classList.add('drawer-open');
  $('drawer').hidden = false;
  requestAnimationFrame(() => $('drawer').classList.add('open'));
  $('drawer-body').scrollTop = 0;
  if (!wasOpen) {
    $('drawer').classList.add('fresh');
    setTimeout(() => $('drawer').classList.remove('fresh'), 1600);
  }
  renderDrawer(!wasOpen);
  $('drawer').querySelector('.drawer-close').focus({ preventScroll: true });
}

function closeGame() {
  if (openId == null) return;
  openId = null;
  history.replaceState(null, '', location.pathname + location.search);
  $('drawer').classList.remove('open');
  document.body.classList.remove('drawer-open');
  setTimeout(() => { if (openId == null) $('drawer').hidden = true; }, 400);
}

function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(Math.max(raw, 1)));
  const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

function agoIso(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return '—';
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  if (s < 86400 * 60) return `${Math.round(s / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}

let pointerQueued = null;
document.addEventListener('pointermove', (e) => {

function applyPointer(e) {

// ---- scroll animations ----
const revealObserver = 'IntersectionObserver' in window && !reduceMotion
  ? new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      e.target.classList.add('in');
      revealObserver.unobserve(e.target);
      setTimeout(() => e.target.classList.add('done'), 2000);
    }
  }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' })
  : null;

function observeReveals(root) {
  root.querySelectorAll('.reveal:not(.in), .reveal-group:not(.in)').forEach((el) => {
    if (revealObserver) revealObserver.observe(el);
    else el.classList.add('in', 'done');
  });
}

function splitWords(el) {
  const text = el.textContent;
  if (el.dataset.text === text) return;
  el.dataset.text = text;
  el.innerHTML = text.split(/(\s+)/).map((w) => (/^\s+$/.test(w) ? w : `<span class="w">${esc(w)}</span>`)).join('');
}

const clamp01 = (v) => Math.max(0, Math.min(1, v));

// Scroll-linked effects: shrinking hero, words lighting up, thumbnails settling.
function updateScrollFx() {
  const root = document.documentElement, vh = innerHeight;
  const max = root.scrollHeight - vh;
  const bar = document.querySelector('.progress');
  if (bar) bar.style.setProperty('--sp', max > 0 ? (scrollY / max).toFixed(4) : 0);
  if (reduceMotion) return;
  const stage = $('stage');
  if (stage) {
    const r = stage.getBoundingClientRect();
    stage.style.setProperty('--p', clamp01(-r.top / Math.max(1, r.height - vh)).toFixed(4));
  }
  document.querySelectorAll('[data-words]').forEach((el) => {
    const r = el.getBoundingClientRect();
    if (r.bottom < -200 || r.top > vh + 200) return;
    const p = clamp01((vh * 0.88 - r.top) / (vh * 0.45));
    const words = el.querySelectorAll('.w');
    const lit = Math.round(p * words.length);
    words.forEach((w, i) => w.classList.toggle('lit', i < lit));
  });
  document.querySelectorAll('.thumb img.banner').forEach((img) => {
    const r = img.getBoundingClientRect();
    if (r.bottom < 0 || r.top > vh) return;
    img.style.setProperty('--z', (1 + 0.16 * clamp01((r.top - vh * 0.25) / (vh * 0.75))).toFixed(4));
  });
}

let scrollQueued = false;
addEventListener('scroll', () => {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => { scrollQueued = false; updateScrollFx(); });
}, { passive: true });

function renderStage(games, ccu) {
  if (!$('stage-ccu')) return;
  const el = $('stage-ccu');
  const prev = Number(el.dataset.v || 0);
  el.dataset.v = ccu;
  countUp(el, prev, ccu, (v) => fmt.format(Math.round(v)));
  $('stage-unit').textContent = ccu === 1 ? 'player right now' : 'playing right now';
  // A one-sentence summary, lit word by word as it scrolls into view.
  const visits = games.reduce((s, g) => s + g.visits, 0);
  const favs = games.reduce((s, g) => s + g.favorites, 0);
  const up = games.reduce((s, g) => s + g.upVotes, 0), down = games.reduce((s, g) => s + g.downVotes, 0);
  let hours = 0;
  for (const g of games) {
    const h = within(g, 168);
    for (let i = 1; i < h.length; i++) hours += ((h[i][1] + h[i - 1][1]) / 2) * ((h[i][0] - h[i - 1][0]) / 3600000);
  }
  const n = games.length;
  let text = `${n} experience${n === 1 ? '' : 's'}. ${fmt.format(visits)} visits. ${fmt.format(favs)} favorites.`;
  if (up + down) text += ` ${Math.round((up / (up + down)) * 100)}% of players like what you made.`;
  if (hours >= 1) text += ` And this week, people spent ${fmt.format(Math.round(hours))} hours playing.`;
  const st = $('statement');
  st.textContent = text;
  st.dataset.text = '';
  splitWords(st);
  updateScrollFx();
}

const hz = (m) => 440 * 2 ** ((m - 69) / 12);
const pick = (a) => a[Math.floor(Math.random() * a.length)];

const MOODS = [
  {
    name: 'Midnight Drift', sub: 'Ambient · 68 BPM', bpm: 68, swing: 0,

      if (s === 0 || s === 8) a.bass(this.roots[i], t, spb * 7, 0.18);
      const arp = [c[0], c[1], c[2], c[0] + 12, c[2], c[1]].map((n) => n + 12);
      a.pluck(arp[s % arp.length], t, s % 4 === 0 ? 0.11 : 0.07, 0.5);

class Ambient {
  constructor() { this.ctx = null; this.mood = 0; this.vol = 0.6; this.playing = false; }

  init() {
    const ctx = (this.ctx = new (window.AudioContext || window.webkitAudioContext)());
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3;
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 256;
    this.analyser.smoothingTimeConstant = 0.82;
    this.bus = ctx.createGain();
    this.dry = ctx.createGain();
    const verb = ctx.createConvolver();
    verb.buffer = this.impulse(3.4, 2.4);
    const wet = ctx.createGain();
    wet.gain.value = 0.5;
    this.bus.connect(this.dry);
    this.bus.connect(verb);
    verb.connect(wet);
    this.dry.connect(comp);
    wet.connect(comp);
    comp.connect(this.master);
    this.master.connect(this.analyser);
    this.analyser.connect(ctx.destination);
    // Echo for plucks.
    this.echo = ctx.createDelay(1);
    this.echo.delayTime.value = 0.36;
    const fb = ctx.createGain();
    fb.gain.value = 0.32;
    const echoOut = ctx.createGain();
    echoOut.gain.value = 0.35;
    this.echo.connect(fb); fb.connect(this.echo);
    this.echo.connect(echoOut); echoOut.connect(this.bus);
    this.noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  impulse(sec, decay) {
    const r = this.ctx.sampleRate, len = Math.floor(r * sec), b = this.ctx.createBuffer(2, len, r);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** decay;
    }
    return b;
  }

  env(g, t, peak, attack, hold, release) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.setValueAtTime(peak, t + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
    return t + attack + hold + release + 0.05;
  }

  pad(notes, t, dur, level) {
    const ctx = this.ctx, f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.Q.value = 0.6;
    f.frequency.setValueAtTime(380, t);
    f.frequency.linearRampToValueAtTime(1500, t + dur * 0.5);
    f.frequency.linearRampToValueAtTime(600, t + dur + 2);
    const end = this.env(g, t, level, 2.2, Math.max(0, dur - 2.2), 3);
    f.connect(g); g.connect(this.bus);
    for (const n of notes) for (const det of [-8, 8]) {
      const o = ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = hz(n); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(end);
    }
  }

  pluck(n, t, level, decay) {
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = hz(n);
    const end = this.env(g, t, level, 0.006, 0, decay);
    o.connect(g); g.connect(this.bus); g.connect(this.echo);
    o.start(t); o.stop(end);
  }

  keys(n, t, dur, level) {
    // Soft electric piano: sine with a quiet octave partial and slow tremolo.
    const ctx = this.ctx, g = ctx.createGain(), trem = ctx.createGain(), lfo = ctx.createOscillator(), lfoAmt = ctx.createGain();
    lfo.frequency.value = 4.2; lfoAmt.gain.value = 0.25; trem.gain.value = 0.75;
    lfo.connect(lfoAmt); lfoAmt.connect(trem.gain);
    const end = this.env(g, t, level, 0.01, 0.2, Math.min(dur, 2.4));
    g.connect(trem); trem.connect(this.bus);
    for (const [mult, amp] of [[1, 1], [2, 0.18]]) {
      const o = ctx.createOscillator(), a = ctx.createGain();
      o.type = 'sine'; o.frequency.value = hz(n) * mult; a.gain.value = amp;
      o.connect(a); a.connect(g); o.start(t); o.stop(end);
    }
    lfo.start(t); lfo.stop(end);
  }

  bass(n, t, dur, level) {
    const ctx = this.ctx, o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = hz(n);
    f.type = 'lowpass'; f.frequency.value = 420;
    const end = this.env(g, t, level, 0.03, Math.max(0, dur - 0.4), 0.5);
    o.connect(f); f.connect(g); g.connect(this.dry);
    o.start(t); o.stop(end);
  }

  kick(t, level) {
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    const end = this.env(g, t, level, 0.002, 0.02, 0.32);
    o.connect(g); g.connect(this.dry);
    o.start(t); o.stop(end);
  }

  noiseHit(t, level, type, freq, decay, toBus = false) {
    const ctx = this.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.noise;
    src.playbackRate.value = 0.9 + Math.random() * 0.2;
    f.type = type; f.frequency.value = freq;
    const end = this.env(g, t, level, 0.001, 0, decay);
    src.connect(f); f.connect(g); g.connect(toBus ? this.bus : this.dry);
    src.start(t, Math.random()); src.stop(end);
  }

  snare(t, level) { this.noiseHit(t, level, 'bandpass', 1800, 0.18, true); }
  hat(t, level) { this.noiseHit(t, level, 'highpass', 7500, 0.045); }
  crackle(t) { this.noiseHit(t, 0.02 + Math.random() * 0.03, 'highpass', 3000, 0.008); }

  start() {
    if (!this.ctx) this.init();
    this.ctx.resume();
    const now = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(this.master.gain.value, now);
    this.master.gain.linearRampToValueAtTime(this.vol, now + 1.2);
    if (this.playing) return;
    this.playing = true;
    this.step = 0;
    this.next = now + 0.1;
    clearInterval(this.timer);
    this.timer = setInterval(() => this.schedule(), 25);
  }

  stop() {
    if (!this.ctx || !this.playing) return;
    this.playing = false;
    const now = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(this.master.gain.value, now);
    this.master.gain.linearRampToValueAtTime(0, now + 0.6);
    clearTimeout(this.stopTimer);
    this.stopTimer = setTimeout(() => { if (!this.playing) { clearInterval(this.timer); this.ctx.suspend(); } }, 700);
  }

  setVolume(v) {
    this.vol = v;
    if (this.ctx && this.playing) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
  }

  setMood(i) {
    this.mood = (i + MOODS.length) % MOODS.length;
    this.step = 0;
    if (this.ctx) this.next = Math.max(this.next || 0, this.ctx.currentTime + 0.05);
  }

  schedule() {
    const m = MOODS[this.mood], spb = 60 / m.bpm / 4;
    while (this.next < this.ctx.currentTime + 0.15) {
      m.play(this, this.step, this.next, spb);
      const swing = m.swing ? (this.step % 2 === 0 ? 1 + m.swing : 1 - m.swing) : 1;
      this.next += spb * swing;
      this.step++;
    }
  }
}


const music = new Ambient();
music.vol = Math.min(1, Math.max(0, Number(load('rgo.vol') ?? 0.6)));
music.mood = Math.min(MOODS.length - 1, Math.max(0, Number(load('rgo.mood')) || 0));

// ---- YouTube: paste links, play them through the official embedded player ----
function parseYouTube(text) {
  const raw = text.trim();
  if (/^[\w-]{11}$/.test(raw)) return { v: raw };
  let u;
  try { u = new URL(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`); } catch { return null; }
  const host = u.hostname.replace(/^(www|m|music)\./, '');
  let v = null;
  if (host === 'youtu.be') v = u.pathname.split('/')[1];
  else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
    if (u.pathname === '/watch') v = u.searchParams.get('v');
    else { const m = u.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{11})/); if (m) v = m[2]; }
  } else return null;
  const list = u.searchParams.get('list');
  if (v && !/^[\w-]{11}$/.test(v)) v = null;
  if (!v && !list) return null;
  const start = parseInt(u.searchParams.get('t') || u.searchParams.get('start'), 10) || 0;
  return v ? { v, start } : { list };
}

let queue = [];
try { queue = JSON.parse(load('rgo.queue') || '[]').filter((q) => q && (q.v || q.list)); } catch { queue = []; }
const saveQueue = () => store('rgo.queue', JSON.stringify(queue));
let src = 'mood';      // 'mood' (generated) or 'yt'
let ytIndex = -1;
let yt = null, ytReady = null, ytPlaying = false, ytErrors = 0;

function loadYouTubeApi() {
  if (ytReady) return ytReady;
  ytReady = new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve();
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(); };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = () => { ytReady = null; reject(new Error('YouTube could not be reached')); };
    document.head.appendChild(tag);
  });
  return ytReady;
}

function setMsg(text) {
  $('p-msg').textContent = text || '';
  clearTimeout(setMsg.t);
  if (text) setMsg.t = setTimeout(() => { $('p-msg').textContent = ''; }, 5000);
}

async function fetchTitle(item) {
  try {
    const url = item.v ? `https://www.youtube.com/watch?v=${item.v}` : `https://www.youtube.com/playlist?list=${item.list}`;
    const res = await fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(url)}`);
    if (!res.ok) return;
    const j = await res.json();
    item.title = j.title || item.title;
    item.author = j.author_name || item.author;
    saveQueue();
    renderPlayer();
  } catch { /* titles fill in once the video loads instead */ }
}

function addLink(text) {
  const parsed = parseYouTube(text);
  if (!parsed) { setMsg("That doesn't look like a YouTube link."); return; }
  const existing = queue.findIndex((q) => (parsed.v ? q.v === parsed.v : q.list === parsed.list));
  if (existing >= 0) { playYT(existing); return; }
  const item = { ...parsed, title: parsed.v ? 'YouTube video' : 'YouTube playlist', author: '' };
  queue.push(item);
  saveQueue();
  fetchTitle(item);
  playYT(queue.length - 1);
}

async function playYT(i) {
  if (!queue.length) return;
  ytIndex = (i + queue.length) % queue.length;
  const item = queue[ytIndex];
  src = 'yt';
  music.stop();
  radio = null;
  $('player').classList.add('yt');
  beginSwap();
  renderPlayer();
  try { await loadYouTubeApi(); } catch (e) { setMsg(`${e.message}. Check your connection and try again.`); return; }
  yt?.setVolume?.(Math.round(music.vol * 100));
  if (!yt) {
    yt = new YT.Player('yt-frame', {
      width: '100%', height: '200',
      videoId: item.v || undefined,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, controls: 0, fs: 0, iv_load_policy: 3, disablekb: 1, start: item.start || 0, ...(item.list ? { listType: 'playlist', list: item.list } : {}) },
      events: {
        onReady: (e) => { e.target.setVolume(Math.round(music.vol * 100)); e.target.playVideo(); },
        onStateChange: onYTState,
        onError: onYTError,
      },
    });
  } else if (item.v) {
    yt.loadVideoById({ videoId: item.v, startSeconds: item.start || 0 });
  } else {
    yt.loadPlaylist({ list: item.list, listType: 'playlist' });
  }
}

function onYTState(e) {
  const S = YT.PlayerState;
  ytPlaying = e.data === S.PLAYING || e.data === S.BUFFERING;
  const cur = yt.getVideoData && yt.getVideoData();
  if (cur && cur.video_id && cur.video_id !== lastVid) { lastVid = cur.video_id; beginSwap(); }
  if (e.data === S.PLAYING) endSwap();
  if (radio && e.data === S.PLAYING && cur) {
    radio.now = { id: cur.video_id, title: cur.title || 'Recommended song', author: cur.author || '' };
  }
  if (radio) {
    if (e.data === S.ENDED) {
      const pl = yt.getPlaylist && yt.getPlaylist();
      if (!pl || yt.getPlaylistIndex() >= pl.length - 1) startRadio();
    }
    renderPlayer();
    if (ytPlaying) drawViz();
    return;
  }
  if (e.data === S.PLAYING) {
    ytErrors = 0;
    const vd = yt.getVideoData && yt.getVideoData();
    if (vd && vd.video_id && queue[ytIndex]) queue[ytIndex].nowId = vd.video_id;
    const d = yt.getVideoData && yt.getVideoData();
    const item = queue[ytIndex];
    if (d && item && d.title) {
      if (item.v) { item.title = d.title; item.author = d.author || item.author; saveQueue(); }
      item.now = d.title;
      item.nowAuthor = d.author;
    }
  }
  if (e.data === S.ENDED) {
    const item = queue[ytIndex];
    const pl = item && item.list && yt.getPlaylist && yt.getPlaylist();
    const atEnd = !pl || yt.getPlaylistIndex() >= pl.length - 1;
    // Keep going: next in the queue, or recommendations once the queue runs out.
    if (atEnd && ytIndex < queue.length - 1) playYT(ytIndex + 1);
    else if (atEnd) startRadio();
  }
  renderPlayer();
  if (ytPlaying) drawViz();
}

function onYTError(e) {
  ytErrors++;
  const blocked = e.data === 101 || e.data === 150;
  setMsg(blocked ? "This video's owner doesn't allow playing it outside YouTube, so it was skipped." : "This video couldn't be played, so it was skipped.");
  ytPlaying = false;
  renderPlayer();
  if (radio) { if (ytErrors < 5) setTimeout(() => yt.nextVideo(), 800); return; }
  if (queue.length > 1 && ytErrors < queue.length) setTimeout(() => playYT(ytIndex + 1), 1200);
}

// ---- recommendations: when the queue runs out, play YouTube's Mix for the last song ----
let radio = null;      // { seed, seedTitle, now: { id, title, author } }
let lastVid = null;

function currentVideoId() {
  const d = yt && yt.getVideoData && yt.getVideoData();
  return (d && d.video_id) || (queue[ytIndex] && (queue[ytIndex].nowId || queue[ytIndex].v)) || null;
}

function startRadio() {
  const seed = (radio && radio.now && radio.now.id) || currentVideoId();
  if (!seed || !yt || !yt.loadPlaylist) { setMsg('Play a YouTube video first, then press next for recommendations.'); return; }
  const seedTitle = (radio && radio.now && radio.now.title) || (queue[ytIndex] && (queue[ytIndex].now || queue[ytIndex].title)) || 'this song';
  radio = { seed, seedTitle, now: null };
  ytErrors = 0;
  src = 'yt';
  music.stop();
  beginSwap();
  setMsg(`Playing songs like “${seedTitle}”.`);
  // Index 0 of a Mix is the seed itself, so start from the next song.
  yt.loadPlaylist({ list: `RD${seed}`, listType: 'playlist', index: 1 });
  renderPlayer();
}

// Fade the video out to the poster while the next track loads, then back in.
function beginSwap() {
  const el = $('player');
  el.classList.remove('vid-ready');
  el.classList.add('swapping');
  clearTimeout(beginSwap.t);
  beginSwap.t = setTimeout(() => el.classList.remove('swapping'), 450);
}
function endSwap() {
  clearTimeout(endSwap.t);
  endSwap.t = setTimeout(() => $('player').classList.add('vid-ready'), 120);
}

function removeItem(i) {
  const wasCurrent = src === 'yt' && i === ytIndex;
  queue.splice(i, 1);
  saveQueue();
  if (i < ytIndex) ytIndex--;
  if (wasCurrent) {
    if (queue.length) playYT(Math.min(i, queue.length - 1));
    else { yt?.stopVideo?.(); ytPlaying = false; ytIndex = -1; src = 'mood'; radio = null; $('player').classList.remove('yt'); }
  }
  renderPlayer();
}

const isPlaying = () => (src === 'yt' ? ytPlaying : music.playing);

function renderPlayer() {
  const item = src === 'yt' ? queue[ytIndex] : null;
  const m = MOODS[music.mood];
  const rn = src === 'yt' && radio ? (radio.now || { id: null, title: 'Finding recommendations…', author: `Based on ${radio.seedTitle}` }) : null;
  $('p-kicker').textContent = rn ? 'Recommended · YouTube' : item ? (ytPlaying ? 'Now playing · YouTube' : 'YouTube') : 'Generated live';
  setTitle(rn ? rn.title : item ? (item.now || item.title) : m.name);
  setArt(rn ? (rn.id || radio.seed) : item ? (item.nowId || item.v) : null);
  $('p-sub').textContent = rn ? (rn.author || `Based on ${radio.seedTitle}`) : item ? (item.nowAuthor || item.author || (item.list ? 'Playlist' : 'YouTube')) : m.sub;
  $('player').classList.toggle('playing', isPlaying());
  $('np-text').textContent = isPlaying() ? (rn ? rn.title : item ? (item.now || item.title) : m.name) : (src === 'yt' && item ? 'Paused' : 'Music');
  document.querySelector('.np .np-disc').style.animationPlayState = isPlaying() ? 'running' : 'paused';
  $('player').classList.toggle('yt', src === 'yt');
  $('p-play').setAttribute('aria-label', isPlaying() ? 'Pause' : 'Play');
  $('p-icon').innerHTML = isPlaying()
    ? '<rect x="6" y="4.5" width="3.5" height="13" rx="1" fill="currentColor"/><rect x="12.5" y="4.5" width="3.5" height="13" rx="1" fill="currentColor"/>'
    : '<path d="M7 4.5v13l11-6.5z" fill="currentColor"/>';
  $('p-stations').innerHTML = MOODS.map((x, i) => `<button type="button" data-mood="${i}" aria-pressed="${src === 'mood' && i === music.mood}">${x.name}</button>`).join('');
  $('p-queue').innerHTML = queue.length
    ? queue.map((q, i) => `<li class="${src === 'yt' && !radio && i === ytIndex ? 'on' : ''}" data-q="${i}">
        <span class="qthumb">${q.v ? `<img src="https://i.ytimg.com/vi/${esc(q.v)}/mqdefault.jpg" alt="" loading="lazy">` : '<span class="ph"></span>'}<span class="q-eq" aria-hidden="true"><i></i><i></i><i></i></span></span>
        <span class="qt"><b>${esc(q.title)}</b><span>${esc(q.author || (q.list ? 'Playlist' : 'YouTube'))}</span></span>
        <button class="rm" type="button" data-rm="${i}" aria-label="Remove ${esc(q.title)}">✕</button>
      </li>`).join('')
    : '<li class="p-empty">Search YouTube or paste a video or playlist link above.</li>';
  if (src === 'yt' && radio) {
    $('p-queue').insertAdjacentHTML('beforeend', `<li class="radio on" data-radio>
      <span class="qthumb"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9a6 6 0 0 1 12 0M5.5 9a3.5 3.5 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/></svg><span class="q-eq" aria-hidden="true"><i></i><i></i><i></i></span></span>
      <span class="qt"><b>${esc(radio.now ? radio.now.title : 'Recommended songs')}</b><span>Recommended · based on ${esc(radio.seedTitle)}</span></span>
    </li>`);
  }
  $('p-clear').hidden = !queue.length;
  showVolume();
}

function showVolume() {
  $('p-vol').value = music.vol;
  $('p-vol').style.setProperty('--v', `${music.vol * 100}%`);
  $('p-vol-out').textContent = Math.round(music.vol * 100);
  $('p-vol-icon').innerHTML = music.vol === 0
    ? '<path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11.5 6l3 4M14.5 6l-3 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'
    : `<path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>${music.vol > 0.5 ? '<path d="M12.8 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>' : ''}`;
  $('p-mute').setAttribute('aria-label', music.vol === 0 ? 'Unmute' : 'Mute');
}

function setVolume(v) {
  music.setVolume(v);
  yt?.setVolume?.(Math.round(v * 100));
  store('rgo.vol', v);
  showVolume();
}

// Long titles glide back and forth instead of being cut off.
function setTitle(text) {
  const el = $('p-title');
  if (el.dataset.t === text) return;
  el.dataset.t = text;
  el.innerHTML = `<span>${esc(text)}</span>`;
  el.classList.remove('marquee');
  requestAnimationFrame(() => {
    const over = el.firstChild.scrollWidth - el.clientWidth;
    if (over > 4) {
      el.style.setProperty('--mq', `${-over - 16}px`);
      el.style.setProperty('--mq-t', `${Math.max(6, over / 18)}s`);
      el.classList.add('marquee');
    }
  });
}

// Current video's thumbnail tints the player backdrop, vinyl label and video glow.
function setArt(id) {
  const url = id ? `url("https://i.ytimg.com/vi/${id}/hqdefault.jpg")` : '';
  const el = $('player');
  if (el.dataset.art === url) return;
  el.dataset.art = url;
  if (url) el.style.setProperty('--art', url); else el.style.removeProperty('--art');
  el.classList.toggle('has-art', !!url);
  setAmbientArt(id);
}

const fmtTime = (t) => {
  t = Math.max(0, Math.floor(t || 0));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = String(t % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
};

let seeking = false;
function updateProgress() {
  if (src !== 'yt' || !yt || !yt.getDuration || seeking) return;
  const dur = yt.getDuration() || 0, cur = yt.getCurrentTime() || 0;
  $('p-seek').style.setProperty('--pos', `${dur ? (cur / dur) * 100 : 0}%`);
  $('p-seek').setAttribute('aria-valuenow', dur ? Math.round((cur / dur) * 100) : 0);
  $('p-cur').textContent = fmtTime(cur);
  $('p-dur').textContent = fmtTime(dur);
}
setInterval(updateProgress, 400);

function seekFromEvent(e, commit) {
  const r = $('p-seek').getBoundingClientRect();
  const k = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const dur = (yt && yt.getDuration && yt.getDuration()) || 0;
  $('p-seek').style.setProperty('--pos', `${k * 100}%`);
  $('p-cur').textContent = fmtTime(k * dur);
  if (commit && dur) yt.seekTo(k * dur, true);
}
$('p-seek').addEventListener('pointerdown', (e) => {
  if (src !== 'yt' || !yt) return;
  seeking = true;
  $('p-seek').classList.add('drag');
  $('p-seek').setPointerCapture(e.pointerId);
  seekFromEvent(e, false);
});
$('p-seek').addEventListener('pointermove', (e) => { if (seeking) seekFromEvent(e, false); });
$('p-seek').addEventListener('pointerup', (e) => {
  if (!seeking) return;
  seekFromEvent(e, true);
  seeking = false;
  $('p-seek').classList.remove('drag');
});
$('p-seek').addEventListener('keydown', (e) => {
  if (src !== 'yt' || !yt || !yt.getCurrentTime) return;
  if (e.key === 'ArrowRight') yt.seekTo(yt.getCurrentTime() + 5, true);
  if (e.key === 'ArrowLeft') yt.seekTo(yt.getCurrentTime() - 5, true);
});

let lastVol = 0.6;
$('p-mute').onclick = () => {
  if (music.vol > 0) { lastVol = music.vol; setVolume(0); } else setVolume(lastVol || 0.6);
};

function togglePlay() {
  if (src === 'yt' && yt && yt.getPlayerState) {
    if (ytPlaying) yt.pauseVideo(); else yt.playVideo();
    return;
  }
  if (src === 'yt' && queue.length) { playYT(Math.max(0, ytIndex)); return; }
  if (music.playing) music.stop(); else music.start();
  renderPlayer();
  if (music.playing) drawViz();
}

function step(dir) {
  if (src === 'yt' && radio && yt) {
    if (dir > 0) return yt.nextVideo();
    const k = yt.getPlaylistIndex ? yt.getPlaylistIndex() : 0;
    if (k > 1) return yt.previousVideo();
    return playYT(ytIndex);   // back to the song the recommendations came from
  }
  if (src === 'yt' && queue.length) {
    const item = queue[ytIndex];
    const pl = item && item.list && yt && yt.getPlaylist && yt.getPlaylist();
    if (pl && pl.length) {
      const k = yt.getPlaylistIndex();
      if (dir > 0 && k < pl.length - 1) return yt.nextVideo();
      if (dir < 0 && k > 0) return yt.previousVideo();
    }
    if (dir > 0 && ytIndex >= queue.length - 1) return startRadio();
    return playYT(ytIndex + dir);
  }
  changeMood(music.mood + dir);
}

function changeMood(i) {
  if (src === 'yt') { yt?.pauseVideo?.(); ytPlaying = false; src = 'mood'; radio = null; }
  music.setMood(i);
  store('rgo.mood', music.mood);
  if (!music.playing) music.start();
  renderPlayer();
  drawViz();
}

function setPlayerOpen(open) {
  $('player').classList.toggle('open', open);
  $('np').setAttribute('aria-expanded', open);
  store('rgo.player', open ? 'open' : 'min');
  if (open) drawViz();
}
$('p-orb').onclick = () => setPlayerOpen(true);
$('np').onclick = (e) => { e.stopPropagation(); setPlayerOpen(!$('player').classList.contains('open')); };
// Clicking anywhere outside the player closes it.
document.addEventListener('pointerdown', (e) => {
  if ($('player').classList.contains('open') && !e.target.closest('#player, #np')) setPlayerOpen(false);
});
$('p-min').onclick = () => setPlayerOpen(false);
$('p-play').onclick = togglePlay;
$('p-prev').onclick = () => step(-1);
$('p-next').onclick = () => step(1);
$('p-stations').onclick = (e) => { const b = e.target.closest('[data-mood]'); if (b) changeMood(Number(b.dataset.mood)); };
$('p-add').onsubmit = (e) => {
  e.preventDefault();
  const v = $('p-url').value.trim();
  if (!v) return;
  if (parseYouTube(v)) { $('p-url').value = ''; hideResults(); addLink(v); } else searchYouTube(v);
};

// ---- YouTube search (through the Cloudflare worker, which holds the API key) ----
const decodeHtml = (t) => { const el = document.createElement('textarea'); el.innerHTML = t; return el.value; };
let lastResults = [];
function hideResults() { $('p-results').hidden = true; $('p-results').innerHTML = ''; }
async function searchYouTube(q) {
  if (!data || !data.liveProxy) { setMsg('Search needs the Cloudflare worker. Paste a YouTube link instead.'); return; }
  $('p-results').hidden = false;
  $('p-results').innerHTML = '<li class="p-empty">Searching…</li>';
  try {
    const res = await fetch(`${data.liveProxy.replace(/\/$/, '')}/search?q=${encodeURIComponent(q)}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Search failed.');
    lastResults = body.results || [];
    $('p-results').innerHTML = lastResults.length ? lastResults.map((r, i) => `<li data-res="${i}" tabindex="0">
        <span class="qthumb"><img src="${esc(r.thumb || `https://i.ytimg.com/vi/${r.id}/mqdefault.jpg`)}" alt="" loading="lazy"></span>
        <span class="qt"><b>${esc(decodeHtml(r.title))}</b><span>${esc(decodeHtml(r.channel || ''))}</span></span>
        <span class="r-add" aria-hidden="true">+</span>
      </li>`).join('') : '<li class="p-empty">No results.</li>';
  } catch (e) {
    $('p-results').innerHTML = `<li class="p-empty">${esc(e.message === 'Failed to fetch' ? 'Search is not available right now. Paste a link instead.' : e.message)}</li>`;
  }
}
function pickResult(i) {
  const r = lastResults[i];
  if (!r) return;
  hideResults();
  $('p-url').value = '';
  const existing = queue.findIndex((q) => q.v === r.id);
  if (existing >= 0) return playYT(existing);
  queue.push({ v: r.id, title: decodeHtml(r.title), author: decodeHtml(r.channel || ''), start: 0 });
  saveQueue();
  playYT(queue.length - 1);
}
$('p-results').addEventListener('click', (e) => { const li = e.target.closest('[data-res]'); if (li) pickResult(Number(li.dataset.res)); });
$('p-results').addEventListener('keydown', (e) => { const li = e.target.closest('[data-res]'); if (li && e.key === 'Enter') pickResult(Number(li.dataset.res)); });
$('p-url').addEventListener('input', () => { if (!$('p-url').value.trim()) hideResults(); });
$('p-url').addEventListener('paste', (e) => {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (parseYouTube(text)) { e.preventDefault(); $('p-url').value = ''; addLink(text); }
});
$('p-queue').onclick = (e) => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { e.stopPropagation(); removeItem(Number(rm.dataset.rm)); return; }
  const li = e.target.closest('[data-q]');
  if (li) playYT(Number(li.dataset.q));
};
$('p-clear').onclick = () => {
  queue = []; saveQueue();
  if (src === 'yt') { yt?.stopVideo?.(); ytPlaying = false; ytIndex = -1; src = 'mood'; radio = null; $('player').classList.remove('yt'); }
  renderPlayer();
};
$('p-vol').oninput = (e) => setVolume(Number(e.target.value));
