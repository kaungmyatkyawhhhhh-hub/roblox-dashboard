      <div class="d-title"><h2>${esc(g.name)}</h2><div class="faint">${esc(genreLine(g))}${g.maxPlayers ? ` · up to ${g.maxPlayers} per server` : ''}</div></div>
      <a class="play" href="https://www.roblox.com/games/${g.placeId}" target="_blank" rel="noopener"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>Play</a>
    </div>
    <div class="d-stats">
      <div><div class="k">Playing now</div><div class="v">${fmt.format(g.playing)}</div></div>
      <div><div class="k">24h peak</div><div class="v">${fmt.format(peak(g))}</div></div>
      <div><div class="k">Tracked peak</div><div class="v">${fmt.format(tracked)}</div></div>
      <div><div class="k">Visits</div><div class="v">${fmt.format(g.visits)}</div></div>

      <div><div class="k">Like ratio</div><div class="v">${r == null ? '—' : `${Math.round(r * 100)}%`}</div><div class="like-split"><i style="width:${r == null ? 0 : (r * 100).toFixed(1)}%"></i></div><div class="k">${fmt.format(g.upVotes)} likes · ${fmt.format(g.downVotes)} dislikes</div></div>
    </div>

    <section class="d-sec"><div class="d-sec-head"><h3>Visits per day</h3><span class="faint">Last 30 days</span></div><div class="chart-wrap tight" id="d-visits"></div></section>

  body.scrollTop = scroll;

function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(Math.max(raw, 1)));
  const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

const COLUMNS = [
  { key: 'rank', label: '#', get: (g) => g.playing },
  { key: 'name', label: 'Experience', get: (g) => g.name.toLowerCase() },
  { key: 'playing', label: 'Playing', get: (g) => g.playing },

  { key: 'trend', label: '24h trend', get: (g) => g.playing },
  { key: 'visits', label: 'Visits', get: (g) => g.visits },
  { key: 'gained', label: '24h visits', get: visitsGained },

];

function agoIso(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return '—';
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  if (s < 86400 * 60) return `${Math.round(s / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}

function renderTable(games, colorOf, rankOf) {
  const col = COLUMNS.find((c) => c.key === sort.key);
  const rows = games
    .filter((g) => !filter || g.name.toLowerCase().includes(filter))
    .sort((a, b) => {
      const va = col.get(a), vb = col.get(b);
      return (va < vb ? -1 : va > vb ? 1 : 0) * sort.dir || rankOf.get(a.universeId) - rankOf.get(b.universeId);
    });
  $('count').textContent = filter ? `${rows.length} of ${games.length}` : games.length;
  const head = `<thead><tr>${COLUMNS.map((c) => `<th data-key="${c.key}"${c.key === sort.key ? ` aria-sort="${sort.dir < 0 ? 'descending' : 'ascending'}"` : ''}>${c.label}</th>`).join('')}</tr></thead>`;
  const body = rows.map((g) => {
    const r = rating(g);
    const color = colorOf.has(g.universeId) ? cssVar(colorOf.get(g.universeId)) : cssVar('--ink-3');
    const gained = visitsGained(g);
    return `<tr>
      <td class="rank">${rankOf.get(g.universeId)}</td>
      <td><div class="game">
        ${g.icon ? `<img src="${esc(g.icon)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'), { className: 'noimg' }))">` : '<div class="noimg"></div>'}
        <div>
          <a href="https://www.roblox.com/games/${g.placeId}" target="_blank" rel="noopener" title="${esc(g.name)}">${esc(g.name)}</a>
          <div class="genre">${esc(genreLine(g))}</div>
        </div>
      </div></td>
      <td><span class="ccu${g.playing ? '' : ' idle'}"><span class="dot"></span>${fmt.format(g.playing)}</span></td>
      <td>${fmt.format(peak(g))}</td>
      <td>${sparkline(last24(g), 88, 24, color).replace('<svg', '<svg width="88" height="24"')}</td>
      <td>${fmt.format(g.visits)}</td>
      <td>${gained > 0 ? `<span class="pos">+${fmt.format(gained)}</span>` : gained < 0 ? fmt.format(gained) : '<span class="faint">—</span>'}</td>
      <td>${fmt.format(g.favorites)}</td>
      <td>${r == null ? '<span class="faint">—</span>' : `<span class="ratio">${(r * 100).toFixed(1)}%<span class="bar-meter"><i style="width:${(r * 100).toFixed(1)}%"></i></span></span>`}</td>
      <td class="faint">${agoIso(g.updated)}</td>
    </tr>`;
  }).join('');
  const emptyMsg = filter ? 'No experiences match that filter.' : 'No public experiences found for this account.';
  $('table').innerHTML = head + `<tbody>${body || `<tr><td colspan="${COLUMNS.length}" class="empty">${emptyMsg}</td></tr>`}</tbody>`;
  $('table').querySelectorAll('th').forEach((th) => {
    th.onclick = () => {
      const key = th.dataset.key;
      sort = sort.key === key ? { key, dir: -sort.dir } : { key, dir: key === 'name' ? 1 : -1 };
      render();
    };
  });
}

// ---- scroll animations ----
const revealObserver = 'IntersectionObserver' in window && !reduceMotion
  ? new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      e.target.classList.add('in');
      revealObserver.unobserve(e.target);
      setTimeout(() => e.target.classList.add('done'), 1800);
    }
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' })
  : null;

function observeReveals(root) {
  root.querySelectorAll('.reveal:not(.in), .reveal-group:not(.in)').forEach((el) => {
    if (revealObserver) revealObserver.observe(el);
    else el.classList.add('in', 'done');
  });
}

let scrollQueued = false;
addEventListener('scroll', () => {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => {
    scrollQueued = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    document.documentElement.style.setProperty('--sp', max > 0 ? (scrollY / max).toFixed(4) : 0);
    if (!reduceMotion) document.documentElement.style.setProperty('--sy', Math.round(scrollY));
  });
}, { passive: true });

// ---- music: ambient tracks generated live with Web Audio (no audio files) ----
const hz = (m) => 440 * 2 ** ((m - 69) / 12);
const pick = (a) => a[Math.floor(Math.random() * a.length)];

const MOODS = [
  {
    name: 'Midnight Drift', sub: 'Ambient · 68 BPM', bpm: 68, swing: 0,
    chords: [[50, 53, 57, 60, 64], [46, 50, 53, 57, 62], [53, 57, 60, 64, 67], [48, 52, 55, 57, 62]],
    scale: [62, 65, 67, 69, 72, 74, 77, 79],
    play(a, step, t, spb) {
      const bar = Math.floor(step / 16), chord = this.chords[Math.floor(bar / 2) % 4];
      if (step % 32 === 0) { a.pad(chord, t, spb * 32, 0.05); a.bass(chord[0] - 12, t, spb * 30, 0.12); }
      if (step % 4 === 0 && Math.random() < 0.3) a.pluck(pick(this.scale), t, 0.16, 1.6);
      if (step % 16 === 8 && Math.random() < 0.25) a.pluck(pick(this.scale) + 12, t, 0.07, 2.4);
    },
  },
  {
    name: 'Neon Rain', sub: 'Lo-fi · 82 BPM', bpm: 82, swing: 0.16,
    chords: [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]],
    roots: [41, 40, 38, 36],
    scale: [72, 74, 76, 79, 81, 84],
    play(a, step, t, spb) {
      const i = Math.floor(step / 16) % 4, s = step % 16;
      if (s === 0) { this.chords[i].forEach((n, k) => a.keys(n, t + k * 0.025, spb * 15, 0.07)); }
      if (s === 0 || s === 10) a.bass(this.roots[i], t, spb * (s ? 5 : 9), 0.2);
      if (s === 0 || s === 10 || (s === 7 && Math.random() < 0.4)) a.kick(t, 0.55);
      if (s === 4 || s === 12) a.snare(t, 0.22);
      if (s % 2 === 0 && Math.random() < 0.9) a.hat(t, s % 4 === 2 ? 0.07 : 0.04);
      if (s % 2 === 0 && Math.random() < 0.14) a.pluck(pick(this.scale), t, 0.08, 0.9);
      if (Math.random() < 0.35) a.crackle(t + Math.random() * spb);
    },
  },
  {
    name: 'Aurora', sub: 'Synthwave · 96 BPM', bpm: 96, swing: 0,
    chords: [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]],
    roots: [45, 41, 48, 43],
    play(a, step, t, spb) {
      const i = Math.floor(step / 16) % 4, s = step % 16, c = this.chords[i];
      if (s === 0) a.pad(c.map((n) => n + 12), t, spb * 16, 0.03);
      if (s === 0 || s === 8) a.bass(this.roots[i], t, spb * 7, 0.18);
      const arp = [c[0], c[1], c[2], c[0] + 12, c[2], c[1]].map((n) => n + 12);
      a.pluck(arp[s % arp.length], t, s % 4 === 0 ? 0.11 : 0.07, 0.5);
      if (s === 0 || s === 8) a.kick(t, 0.4);
      if (s % 4 === 2) a.hat(t, 0.045);
    },
  },
];

class Ambient {
  constructor() { this.ctx = null; this.mood = 0; this.vol = 0.6; this.playing = false; }

  init() {
    const ctx = (this.ctx = new (window.AudioContext || window.webkitAudioContext)());
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3;
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 256;
    this.analyser.smoothingTimeConstant = 0.82;
    this.bus = ctx.createGain();
    this.dry = ctx.createGain();
    const verb = ctx.createConvolver();
    verb.buffer = this.impulse(3.4, 2.4);
    const wet = ctx.createGain();
    wet.gain.value = 0.5;
    this.bus.connect(this.dry);
    this.bus.connect(verb);
    verb.connect(wet);
    this.dry.connect(comp);
    wet.connect(comp);
    comp.connect(this.master);
    this.master.connect(this.analyser);
    this.analyser.connect(ctx.destination);
    // Echo for plucks.
    this.echo = ctx.createDelay(1);
    this.echo.delayTime.value = 0.36;
    const fb = ctx.createGain();
    fb.gain.value = 0.32;
    const echoOut = ctx.createGain();
    echoOut.gain.value = 0.35;
    this.echo.connect(fb); fb.connect(this.echo);
    this.echo.connect(echoOut); echoOut.connect(this.bus);
    this.noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  impulse(sec, decay) {
    const r = this.ctx.sampleRate, len = Math.floor(r * sec), b = this.ctx.createBuffer(2, len, r);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** decay;
    }
    return b;
  }

  env(g, t, peak, attack, hold, release) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.setValueAtTime(peak, t + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
    return t + attack + hold + release + 0.05;
  }

  pad(notes, t, dur, level) {
    const ctx = this.ctx, f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.Q.value = 0.6;
    f.frequency.setValueAtTime(380, t);
    f.frequency.linearRampToValueAtTime(1500, t + dur * 0.5);
    f.frequency.linearRampToValueAtTime(600, t + dur + 2);
    const end = this.env(g, t, level, 2.2, Math.max(0, dur - 2.2), 3);
    f.connect(g); g.connect(this.bus);
    for (const n of notes) for (const det of [-8, 8]) {
      const o = ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = hz(n); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(end);
    }
  }

  pluck(n, t, level, decay) {
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = hz(n);
    const end = this.env(g, t, level, 0.006, 0, decay);
    o.connect(g); g.connect(this.bus); g.connect(this.echo);
    o.start(t); o.stop(end);
  }

  keys(n, t, dur, level) {
    // Soft electric piano: sine with a quiet octave partial and slow tremolo.
    const ctx = this.ctx, g = ctx.createGain(), trem = ctx.createGain(), lfo = ctx.createOscillator(), lfoAmt = ctx.createGain();
    lfo.frequency.value = 4.2; lfoAmt.gain.value = 0.25; trem.gain.value = 0.75;
    lfo.connect(lfoAmt); lfoAmt.connect(trem.gain);
    const end = this.env(g, t, level, 0.01, 0.2, Math.min(dur, 2.4));
    g.connect(trem); trem.connect(this.bus);
    for (const [mult, amp] of [[1, 1], [2, 0.18]]) {
      const o = ctx.createOscillator(), a = ctx.createGain();
      o.type = 'sine'; o.frequency.value = hz(n) * mult; a.gain.value = amp;
      o.connect(a); a.connect(g); o.start(t); o.stop(end);
    }
    lfo.start(t); lfo.stop(end);
  }

  bass(n, t, dur, level) {
    const ctx = this.ctx, o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = hz(n);
    f.type = 'lowpass'; f.frequency.value = 420;
    const end = this.env(g, t, level, 0.03, Math.max(0, dur - 0.4), 0.5);
    o.connect(f); f.connect(g); g.connect(this.dry);
    o.start(t); o.stop(end);
  }

  kick(t, level) {
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    const end = this.env(g, t, level, 0.002, 0.02, 0.32);
    o.connect(g); g.connect(this.dry);
    o.start(t); o.stop(end);
  }

  noiseHit(t, level, type, freq, decay, toBus = false) {
    const ctx = this.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.noise;
    src.playbackRate.value = 0.9 + Math.random() * 0.2;
    f.type = type; f.frequency.value = freq;
    const end = this.env(g, t, level, 0.001, 0, decay);
    src.connect(f); f.connect(g); g.connect(toBus ? this.bus : this.dry);
    src.start(t, Math.random()); src.stop(end);
  }

  snare(t, level) { this.noiseHit(t, level, 'bandpass', 1800, 0.18, true); }
  hat(t, level) { this.noiseHit(t, level, 'highpass', 7500, 0.045); }
  crackle(t) { this.noiseHit(t, 0.02 + Math.random() * 0.03, 'highpass', 3000, 0.008); }

  start() {
    if (!this.ctx) this.init();
    this.ctx.resume();
    const now = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(this.master.gain.value, now);
    this.master.gain.linearRampToValueAtTime(this.vol, now + 1.2);
    if (this.playing) return;
    this.playing = true;
    this.step = 0;
    this.next = now + 0.1;
    clearInterval(this.timer);
    this.timer = setInterval(() => this.schedule(), 25);
  }

  stop() {
    if (!this.ctx || !this.playing) return;
    this.playing = false;
    const now = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(this.master.gain.value, now);
    this.master.gain.linearRampToValueAtTime(0, now + 0.6);
    clearTimeout(this.stopTimer);
    this.stopTimer = setTimeout(() => { if (!this.playing) { clearInterval(this.timer); this.ctx.suspend(); } }, 700);
  }

  setVolume(v) {
    this.vol = v;
    if (this.ctx && this.playing) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
  }

  setMood(i) {
    this.mood = (i + MOODS.length) % MOODS.length;
    this.step = 0;
    if (this.ctx) this.next = Math.max(this.next || 0, this.ctx.currentTime + 0.05);
  }

  schedule() {
    const m = MOODS[this.mood], spb = 60 / m.bpm / 4;
    while (this.next < this.ctx.currentTime + 0.15) {
      m.play(this, this.step, this.next, spb);
      const swing = m.swing ? (this.step % 2 === 0 ? 1 + m.swing : 1 - m.swing) : 1;
      this.next += spb * swing;
      this.step++;
    }
  }
}

const music = new Ambient();
music.vol = Math.min(1, Math.max(0, Number(load('rgo.vol') ?? 0.6)));
music.mood = Math.min(MOODS.length - 1, Math.max(0, Number(load('rgo.mood')) || 0));

function renderPlayer() {
  const m = MOODS[music.mood];
  $('p-title').textContent = m.name;
  $('p-sub').textContent = m.sub;
  $('player').classList.toggle('playing', music.playing);
  $('p-play').setAttribute('aria-label', music.playing ? 'Pause' : 'Play');
  $('p-icon').innerHTML = music.playing
    ? '<rect x="6" y="4.5" width="3.5" height="13" rx="1" fill="currentColor"/><rect x="12.5" y="4.5" width="3.5" height="13" rx="1" fill="currentColor"/>'
    : '<path d="M7 4.5v13l11-6.5z" fill="currentColor"/>';
  $('p-stations').innerHTML = MOODS.map((x, i) => `<button type="button" data-mood="${i}" aria-pressed="${i === music.mood}">${x.name}</button>`).join('');
  $('p-vol').value = music.vol;
  $('p-vol').style.setProperty('--v', `${music.vol * 100}%`);
}

function togglePlay() {
  if (music.playing) music.stop(); else music.start();
  renderPlayer();
  if (music.playing) drawViz();
}

function changeMood(i) {
  music.setMood(i);
  store('rgo.mood', music.mood);
  if (!music.playing) music.start();
  renderPlayer();
  drawViz();
}

$('p-orb').onclick = () => { $('player').classList.add('open'); store('rgo.player', 'open'); drawViz(); };
$('p-min').onclick = () => { $('player').classList.remove('open'); store('rgo.player', 'min'); };
$('p-play').onclick = togglePlay;
$('p-prev').onclick = () => changeMood(music.mood - 1);
$('p-next').onclick = () => changeMood(music.mood + 1);
$('p-stations').onclick = (e) => { const b = e.target.closest('[data-mood]'); if (b) changeMood(Number(b.dataset.mood)); };
$('p-vol').oninput = (e) => {

if (load('rgo.player') === 'open') $('player').classList.add('open');
renderPlayer();

// Visualizer bars, plus a --beat value the background glow pulses to.
let vizRunning = false, beat = 0, idleT = 0;
function drawViz() {
  if (vizRunning) return;
  vizRunning = true;
  const canvas = $('p-viz'), g = canvas.getContext('2d');
  const bins = new Uint8Array(128);
  const frame = () => {
    const open = $('player').classList.contains('open');
    if (!music.playing && beat < 0.01 && !open) { vizRunning = false; document.documentElement.style.setProperty('--beat', 0); return; }
    const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (music.analyser && music.playing) music.analyser.getByteFrequencyData(bins); else bins.fill(0);
    const low = (bins[1] + bins[2] + bins[3] + bins[4]) / (4 * 255);
    beat += ((music.playing ? low : 0) - beat) * 0.25;
    document.documentElement.style.setProperty('--beat', beat.toFixed(3));
    const n = 36, gap = 3, bw = (w - gap * (n - 1)) / n;
    const grad = g.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, cssVar('--accent'));
    grad.addColorStop(0.55, '#7c5cff');
    grad.addColorStop(1, '#e87ba4');
    g.fillStyle = grad;
    g.shadowColor = cssVar('--accent');
    g.shadowBlur = 12;
    idleT += 0.03;
    for (let i = 0; i < n; i++) {
      // Log-spaced bins, with highs lifted so the whole bar row moves.
      const idx = Math.floor((i / n) ** 1.35 * 72) + 2;
      let v = Math.min(1, (bins[idx] / 255) * (0.75 + (i / n) * 1.4));
      if (!music.playing) v = 0.04 + Math.sin(idleT + i * 0.45) * 0.025;
      const bh = Math.max(3, v * (h - 4));
      const x = i * (bw + gap), y = (h - bh) / 2;
      g.beginPath();
      g.roundRect ? g.roundRect(x, y, bw, bh, Math.min(bw / 2, 3)) : g.rect(x, y, bw, bh);
      g.fill();
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
if ($('player').classList.contains('open')) drawViz();
document.addEventListener('visibilitychange', () => { if (!document.hidden && (music.playing || $('player').classList.contains('open'))) drawViz(); });

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
loadStatic().then((ok) => {
  if (!ok) return refresh(true);
  const m = location.hash.match(/^#game-(\d+)$/);
  if (m) openGame(m[1], false);
});
</script>
